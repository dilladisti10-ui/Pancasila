const N=Q.length;

/* ---------- STATE ---------- */
let cur=0;let A=Array(N).fill(null);let submitted=false;
const $=s=>document.querySelector(s);
const letters="ABCD";

function answered(i){const q=Q[i],v=A[i];
  if(q.t==="match")return Array.isArray(v)&&v.every(x=>x>=0);
  if(q.t==="order")return Array.isArray(v)&&v.length===q.items.length;
  return v!==null}
function correct(i){const q=Q[i],v=A[i];
  if(q.t==="match")return v.every((x,k)=>x===q.items[k].a);
  if(q.t==="order")return v.every((x,k)=>x===q.ans[k]);
  return v===q.c}

/* ---------- RENDER SOAL ---------- */
function optHtml(q,k,cls){return `<button class="opt ${A[cur]===k?"sel":""}" data-k="${k}"><b>${letters[k]}</b><span>${q.o[k]}</span></button>`}
function render(anim){const q=Q[cur];let h=`<span class="tag">BAGIAN ${q.sec} • ${q.tag}</span><h2 class="qn">SOAL ${cur+1}</h2>`;
  if(q.t==="mc")h+=(q.story?`<div class="story">📌 ${q.story}</div>`:"")+`<p class="qt">${q.q}</p>`+q.o.map((_,k)=>optHtml(q,k)).join("");
  else if(q.t==="case")h+=`<div class="story">📌 ${q.story}</div><p class="qt">${q.q}</p>`+q.o.map((_,k)=>optHtml(q,k)).join("");
  else if(q.t==="pick")h+=`<p class="qt">${q.q}</p><div class="cards4">`+q.o.map((_,k)=>optHtml(q,k)).join("")+`</div>`;
  else if(q.t==="img")h+=scene(q.sc)+`<div class="story">📌 ${q.story}</div><p class="qt">${q.q}</p>`+q.o.map((_,k)=>optHtml(q,k)).join("");
  else if(q.t==="tf")h+=`<p class="qt">${q.q}</p><div class="story" style="font-size:1.05rem">${q.st}</div><div class="tfbox"><button class="opt ${A[cur]===1?"sel":""}" data-k="1">✔ BENAR</button><button class="opt ${A[cur]===0?"sel":""}" data-k="0">✖ SALAH</button></div>`;
  else if(q.t==="match"){if(!A[cur])A[cur]=Array(q.items.length).fill(-1);
    h+=`<p class="qt">${q.q}</p>`+q.items.map((it,r)=>`<div class="mrow"><span>${r+1}. ${it.t}</span><select data-r="${r}" aria-label="Sila untuk perilaku ${r+1}"><option value="-1">Pilih sila...</option>${SILA_S.map((s,k)=>`<option value="${k}" ${A[cur][r]===k?"selected":""}>Sila ${k+1} – ${s}</option>`).join("")}</select></div>`).join("")}
  else if(q.t==="order"){if(!A[cur])A[cur]=[];const ch=A[cur];
    h+=`<p class="qt">${q.q}</p><div class="slots">`+q.items.map((_,p)=>ch[p]!==undefined?`<button class="slot f" data-s="${p}" title="Ketuk untuk menghapus"><em>${p+1}</em>${q.items[ch[p]]}</button>`:`<div class="slot"><em>${p+1}</em>kosong</div>`).join("")+`</div><div class="pool">`+q.items.map((it,k)=>`<button class="opt" data-p="${k}" ${ch.includes(k)?"disabled":""}><b>＋</b><span>${it}</span></button>`).join("")+`</div><button class="btn y" data-reset="1" style="font-size:.55rem">↺ ULANGI SUSUNAN</button>`}
  const b=$("#qbody");b.innerHTML=`<div class="${anim?"in":""}">${h}</div>`;updateNav()}

function updateNav(){
  const done=A.reduce((n,_,i)=>n+(answered(i)?1:0),0);
  $("#lblPos").textContent=`SOAL ${cur+1} / ${N}`;$("#lblDone").textContent=`TERJAWAB ${done} / ${N}`;
  $("#prog").style.width=((cur+1)/N*100)+"%";
  $("#qnav").innerHTML=Q.map((_,i)=>`<button class="${answered(i)?"done":""} ${i===cur?"cur":""}" data-go="${i}" aria-label="Soal ${i+1} ${answered(i)?"sudah dijawab":"belum dijawab"}">${i+1}</button>`).join("");
  $("#btnPrev").disabled=cur===0;
  $("#btnNext").classList.toggle("hidden",cur===N-1);
  $("#btnFinish").classList.toggle("hidden",cur!==N-1);
}
function go(i){cur=Math.max(0,Math.min(N-1,i));$("#warn").classList.remove("show");render(true);window.scrollTo({top:0,behavior:"smooth"})}

/* ---------- EVENT KUIS ---------- */
$("#qbody").addEventListener("click",e=>{const q=Q[cur];
  const o=e.target.closest("[data-k]");
  if(o){A[cur]=+o.dataset.k;render(false);return}
  const p=e.target.closest("[data-p]");
  if(p&&!p.disabled){A[cur].push(+p.dataset.p);render(false);return}
  const s=e.target.closest("[data-s]");
  if(s){A[cur].splice(+s.dataset.s);render(false);return}
  if(e.target.closest("[data-reset]")){A[cur]=[];render(false)}
});
$("#qbody").addEventListener("change",e=>{const r=e.target.dataset.r;if(r!==undefined){A[cur][+r]=+e.target.value;updateNav()}});
$("#qnav").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(+b.dataset.go)});
$("#btnPrev").onclick=()=>go(cur-1);
$("#btnNext").onclick=()=>go(cur+1);
$("#btnFinish").onclick=()=>{
  const miss=[];Q.forEach((_,i)=>{if(!answered(i))miss.push(i+1)});
  const w=$("#warn");
  if(miss.length){w.innerHTML=`⚠️ Kamu belum bisa mengumpulkan jawaban. Masih ada ${miss.length} soal yang belum dijawab lengkap: <b>nomor ${miss.join(", ")}</b>. Klik nomor pada kotak di atas untuk menjawabnya.`;w.classList.add("show");return}
  w.classList.remove("show");$("#confirm").classList.add("show")};
$("#cNo").onclick=()=>$("#confirm").classList.remove("show");
$("#cYes").onclick=()=>{$("#confirm").classList.remove("show");showResult()};
$("#btnStart").onclick=()=>{$("#intro").classList.add("hidden");$("#quiz").classList.remove("hidden");go(0)};
$("#mascotIntro").innerHTML=$mascotIntro();

/* ---------- TEKS JAWABAN (untuk pembahasan) ---------- */
function ansText(i,v){const q=Q[i];
  if(v===null||v===undefined)return "(tidak dijawab)";
  if(q.t==="mc"||q.t==="case"||q.t==="pick"||q.t==="img")return `${letters[v]}. ${q.o[v]}`;
  if(q.t==="tf")return v===1?"BENAR":"SALAH";
  if(q.t==="match")return q.items.map((it,k)=>`• ${it.t} → ${v[k]>=0?"Sila "+(v[k]+1):"-"}`).join("\n");
  if(q.t==="order")return v.map((x,k)=>`${k+1}. ${q.items[x]}`).join("\n")}
function keyOf(i){const q=Q[i];return q.t==="match"?q.items.map(x=>x.a):q.t==="order"?q.ans:q.c}
function qText(i){const q=Q[i];const base=(q.story?q.story+" ":"")+q.q;
  if(q.t==="img")return `${base} (Gambar: ${["","siswa berdoa bersama","siswa menolong teman yang terjatuh","siswa hormat pada bendera Merah Putih","siswa bermusyawarah di meja","siswa piket kelas bersama"][q.sc]})`;
  if(q.t==="tf")return `${q.q} ${q.st}`;
  return base}
function why(q){return q.w?q.w.map((t,k)=>t&&k!==q.c?`<b>Pilihan ${letters[k]}:</b> ${t}`:"").filter(Boolean).join("<br>"):""}

/* ---------- HASIL ---------- */
function showResult(){submitted=true;
  const ok=Q.map((_,i)=>correct(i));const nb=ok.filter(Boolean).length,ns=N-nb,score=nb*5,pct=Math.round(score);
  const quizRecord={type:"kuis",submissionId:"kuis-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),studentName:($("#quizStudentName")&&$("#quizStudentName").value.trim())||"",date:new Date().toISOString(),score:score,correct:nb,incorrect:ns,total:N,answers:Q.map((q,i)=>({number:i+1,question:q.q,answer:ansText(i,A[i]),correct:ok[i]}))};
  try{const old=JSON.parse(localStorage.getItem("rbp_kuis_backup")||"[]");old.push(quizRecord);localStorage.setItem("rbp_kuis_backup",JSON.stringify(old));}catch(e){}
  const driveUrl=(window.RBP_CONFIG&&window.RBP_CONFIG.DRIVE_WEB_APP_URL)||"";
  if(driveUrl){try{fetch(driveUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(quizRecord)});}catch(e){}}
  let g,m,medal;
  if(score>=90){g="MASTER PANCASILA – PENJAGA NILAI BANGSA!";m="Luar biasa! Pemahamanmu sangat kuat. Teruslah menjadi teladan dalam mengamalkan Pancasila.";medal="🏆"}

  $("#quiz").classList.add("hidden");$("#result").classList.remove("hidden");window.scrollTo({top:0});
  confetti(Math.round(15+score*.9));

k refleksi, lebih baik pakai Chrome yah! Kalau tombol CETAK tidak bereaksi, pakai UNDUH WORD.</div><div class="rfpaper">'+rfData()+'</div>';

}

function perm(seed,n){var r=rng(h32(seed)),a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(r()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
