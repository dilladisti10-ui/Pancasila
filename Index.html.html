      materi:{judul:"Memaknai Pancasila sebagai Ideologi Negara", subjudul:"Pancasila memberi arah, tujuan, dan pedoman bagi kehidupan bermasyarakat, berbangsa, dan bernegara.", bagian:[
        {judul:"Apa Itu Ideologi?", paragraf:["Ideologi adalah kumpulan gagasan, nilai, cita-cita, dan keyakinan yang menjadi pedoman bagi seseorang atau kelompok dalam menjalankan kehidupan. Dalam sebuah negara, ideologi berfungsi sebagai arah untuk mencapai tujuan bersama dan sebagai acuan dalam menentukan tindakan maupun kebijakan."]},
        {judul:"Mengapa Pancasila Menjadi Ideologi Negara?", paragraf:["Pancasila dijadikan ideologi negara karena nilai-nilainya digali dari kehidupan bangsa Indonesia, antara lain nilai agama, budaya, adat istiadat, dan kebiasaan masyarakat. Pancasila bukan sekadar lima kalimat yang dihafalkan, melainkan pedoman dalam menentukan sikap, mengambil keputusan, dan menyelenggarakan kehidupan negara."], poin:["Sebagai ajaran: menjadi pedoman untuk menilai baik dan buruknya perilaku.","Sebagai sistem nilai: menjadi dasar pembentukan aturan dan perilaku masyarakat.","Sebagai cita-cita dan tujuan: mengarahkan bangsa menuju kehidupan yang merdeka, bersatu, berdaulat, adil, dan makmur.","Sebagai pandangan hidup: menjadi pedoman masyarakat dalam bersikap dan bertindak."]},
        {judul:"Pancasila sebagai Ideologi Terbuka", paragraf:["Pancasila disebut ideologi terbuka karena penerapan nilai-nilainya dapat menanggapi perkembangan zaman tanpa mengubah nilai dasar yang terkandung dalam lima sila. Perubahan teknologi, ilmu pengetahuan, budaya, dan kebutuhan masyarakat dapat direspons melalui aturan serta tindakan yang sesuai dengan Pancasila.","Contohnya, media sosial dapat digunakan untuk menyebarkan informasi positif dan memperkenalkan budaya Indonesia. Namun, media sosial tidak boleh digunakan untuk menyebarkan kebencian atau memecah belah masyarakat. Terbuka bukan berarti menerima semua pengaruh tanpa penyaringan."]},
        {judul:"Tiga Tingkatan Nilai Pancasila", paragraf:["Nilai dasar, instrumental, dan praksis saling berhubungan. Nilai dasar menjadi landasan, nilai instrumental menjabarkannya dalam aturan dan kebijakan, sedangkan nilai praksis tampak dalam tindakan nyata."], poin:["Nilai dasar: prinsip pokok dalam lima sila yang menjadi landasan dan relatif tetap.","Nilai instrumental: penjabaran nilai dasar ke dalam peraturan perundang-undangan, kebijakan, dan lembaga negara.","Nilai praksis: pelaksanaan nilai Pancasila dalam perilaku sehari-hari.","Contoh: keadilan sosial (nilai dasar) dijabarkan dalam aturan yang melindungi hak warga (instrumental), lalu diwujudkan dengan memperlakukan teman secara adil (praksis)."]},
        {judul:"Dimensi Ideologi Terbuka", paragraf:["Keterbukaan Pancasila dapat dipahami melalui tiga dimensi yang menunjukkan hubungan ideologi dengan kenyataan dan perkembangan masyarakat."], poin:["Dimensi realitas: nilai Pancasila berakar pada kenyataan hidup masyarakat Indonesia.","Dimensi idealisme: Pancasila memuat cita-cita luhur yang ingin diwujudkan bangsa Indonesia.","Dimensi fleksibilitas: Pancasila memungkinkan pengembangan pemikiran dan penerapan baru secara bertanggung jawab tanpa mengubah nilai dasarnya."]}
      ], rangkuman:"Pancasila menjadi ideologi negara karena memuat nilai dan cita-cita bangsa. Sebagai ideologi terbuka, penerapannya dapat berkembang mengikuti zaman, tetapi nilai dasarnya tetap menjadi pegangan."},
      videos:[{judul:"Pancasila sebagai Ideologi Negara", url:"https://www.youtube.com/watch?v=iw22GMGqrKU"}],
      infografis:[{src:"https://drive.google.com/thumbnail?id=1tY9WgWoyjcNGjAVJOBrMJFtS9JJLsVj9&sz=w1600", alt:"Infografis B 1: Pancasila sebagai Ideologi Negara", judul:"Infografis B (1)", desc:"Infografis pertama untuk sub-bab Memaknai Pancasila sebagai Ideologi Negara."},{src:"https://drive.google.com/thumbnail?id=1bhFKYtRZkBZI7-FlsR10enuU8hpFj5eW&sz=w1600", alt:"Infografis B 2: Pancasila sebagai Ideologi Negara", judul:"Infografis B (2)", desc:"Infografis kedua untuk sub-bab Memaknai Pancasila sebagai Ideologi Negara."}], 
      ebooks:[EB1,EB2],
      jurnal:{judul:"Pancasila sebagai Pengembangan Moral Virtual dalam Perspektif Living Ideology", penulis:"Dicky Eko Prasetio", publikasi:"Pancasila: Jurnal Keindonesiaan, Vol. 3, No. 2, Oktober 2023, hlm. 125–133", doi:"10.52738/pjk.v3i2.151", url:"https://ejurnalpancasila.bpip.go.id/index.php/PJK/article/view/151", pdf:"https://ejurnalpancasila.bpip.go.id/index.php/PJK/article/download/151/66/725", ringkasan:"Artikel mengkaji Pancasila sebagai living ideology dan pedoman moral dalam kehidupan virtual. Pembahasannya mencakup kedudukan Pancasila sebagai ideologi negara, dasar negara, way of life, filter dalam kehidupan global, serta kesepakatan luhur.", metode:"Penelitian kepustakaan (library research), dengan inventarisasi, kategorisasi, dan penyimpulan bahan pustaka.", temuan:"Sosialisasi nilai Pancasila di ruang digital dapat dilakukan melalui pendidikan formal dan masyarakat, antara lain melalui penugasan daring, penyebaran konten positif, apresiasi perilaku digital yang bijak, dan penguatan literasi digital.", kesimpulan:"Pancasila perlu dipahami sebagai ideologi yang hidup dan relevan dengan perkembangan masyarakat, termasuk ruang digital. Artikel ini mendukung sub-bab B karena menjelaskan bagaimana nilai Pancasila tetap menjadi pedoman yang kontekstual tanpa kehilangan nilai dasarnya."}},
   c:{no:"C", world:"WORLD 1-3", judul:"Menerapkan Nilai-Nilai Pancasila dalam Kehidupan Global",
      desc:"Penerapan Pancasila dalam kehidupan global dan era modern.",
      thumb:"https://drive.google.com/thumbnail?id=1mq4dz8uEjJxeiH-LY9WpDWHCWBuvvV3C&sz=w1200",
      materi:{judul:"Menerapkan Nilai-Nilai Pancasila dalam Kehidupan Global", subjudul:"Globalisasi membuka peluang sekaligus menghadirkan tantangan bagi pengamalan Pancasila.", bagian:[
        {judul:"Apa Itu Globalisasi?", paragraf:["Globalisasi adalah proses semakin terhubungnya masyarakat di berbagai negara melalui arus informasi, teknologi, komunikasi, ekonomi, pendidikan, politik, dan kebudayaan. Saat ini, seseorang dapat berkomunikasi dengan orang dari negara lain, mempelajari budaya asing, dan memperoleh informasi dunia melalui perangkat digital."]},
        {judul:"Peluang Pancasila di Era Globalisasi", paragraf:["Globalisasi dapat dimanfaatkan untuk memperkenalkan dan menerapkan nilai-nilai Pancasila dalam hubungan internasional maupun kehidupan sehari-hari."], poin:["Politik: memperkenalkan nilai perdamaian, kemanusiaan, penghormatan HAM, dan musyawarah melalui diplomasi serta kerja sama internasional.","Ekonomi: memasarkan produk lokal ke pasar yang lebih luas dengan memperhatikan keadilan dan kesejahteraan bersama.","Pendidikan: memanfaatkan teknologi dan pertukaran pengetahuan untuk meningkatkan mutu pendidikan.","Sosial dan budaya: memperkenalkan budaya Indonesia serta membangun hubungan yang saling menghargai dengan bangsa lain."]},
        {judul:"Tantangan Pancasila di Era Globalisasi", paragraf:["Tidak semua pengaruh global selaras dengan Pancasila. Pengaruh yang diterima tanpa sikap kritis dapat melemahkan nilai kebangsaan dan kehidupan bersama."], poin:["Intoleransi dan sikap tidak menghargai perbedaan.","Perundungan serta penyebaran hoaks dan ujaran kebencian melalui media sosial.","Menurunnya rasa cinta tanah air dan lunturnya identitas nasional.","Politik uang dan penyalahgunaan kekuasaan.","Individualisme, gaya hidup konsumtif, dan kesenjangan sosial."]},
        {judul:"Cara Menghadapi Tantangan Globalisasi", paragraf:["Sikap yang tepat bukan menolak seluruh pengaruh dari luar, melainkan bersikap terbuka sekaligus kritis. Setiap pengaruh perlu dinilai berdasarkan kemanusiaan, persatuan, musyawarah, dan keadilan."], poin:["Memperkuat pemahaman dan pengamalan nilai-nilai Pancasila.","Menggunakan media sosial secara bijak dan memeriksa kebenaran informasi sebelum membagikannya.","Menghargai perbedaan agama, suku, budaya, dan pendapat.","Menumbuhkan rasa cinta tanah air serta mendukung produk lokal.","Mengutamakan musyawarah, hidup sederhana, adil, dan peduli terhadap sesama."]}
      ], rangkuman:"Globalisasi memberi peluang untuk memperluas pengetahuan, kerja sama, dan promosi budaya Indonesia. Tantangannya perlu disikapi secara kritis agar perkembangan zaman tetap selaras dengan nilai-nilai Pancasila."},
      videos:[{judul:"Pancasila dalam Kehidupan Global 1", url:"https://www.youtube.com/watch?v=1OZQnY9jId8"},{judul:"Pancasila dalam Kehidupan Global 2", url:"https://www.youtube.com/watch?v=1N82HQMyENc"}],
      infografis:[{src:"https://drive.google.com/thumbnail?id=1qcmuLYiqGA9dIxZGLy5Hpys2fzGLtxkA&sz=w1600", alt:"Infografis Sub-bab C: Penerapan Nilai Pancasila dalam Kehidupan Global", judul:"Infografis Sub-bab C", desc:"Infografis untuk materi penerapan nilai-nilai Pancasila dalam kehidupan global."}],
      ebooks:[EB1,EB2],
      jurnal:{judul:"Pancasila di Era Digital: Tantangan dan Peluang bagi Gen Z dalam Menjaga Nilai Kebangsaan", penulis:"Raisa Fayyaza Fazilatun Nisa, Reira Kirana Sulaeman, Wi’am Amaliya Hidayat, dan Supriyono", publikasi:"Jurnal Pendidikan Tambusai, Vol. 9, No. 2, 2025, hlm. 18204–18210", doi:"10.31004/jptam.v9i2.28888", url:"https://jptam.org/index.php/jptam/article/view/28888", pdf:"https://jptam.org/index.php/jptam/article/download/28888/19295/70636", ringkasan:"Artikel membahas tantangan dan peluang bagi Gen Z dalam menjaga nilai kebangsaan di era digital, termasuk hoaks, ujaran kebencian, literasi digital, dan pemanfaatan teknologi untuk memperkuat identitas bangsa.", metode:"Studi literatur dengan mengumpulkan, menyeleksi, menganalisis, dan menyintesis sumber yang relevan.", temuan:"Teknologi digital dapat membantu penerapan nilai Pancasila, memperkuat identitas nasional, dan memperluas komunikasi. Namun, ruang digital juga menghadirkan risiko hoaks, ujaran kebencian, penyalahgunaan teknologi, dan lunturnya kesadaran identitas bangsa.", kesimpulan:"Gen Z perlu mengaktualisasikan nilai Pancasila dalam perilaku digital secara bijak dan bertanggung jawab. Artikel ini sesuai dengan sub-bab C karena menghubungkan penerapan Pancasila dengan globalisasi dan perkembangan teknologi."}},
   d:{no:"D", world:"WORLD 1-4", judul:"Nilai-Nilai Pancasila sebagai Identitas Nasional dalam Kehidupan Sehari-hari",
      desc:"Kenali peluang dan tantangan perkembangan zaman serta penerapan nilai-nilai Pancasila dalam kehidupan.",
      thumb:"https://drive.google.com/thumbnail?id=1nl2Joy3VrRwddntnegEPj55hD85TQxj4&sz=w1200",
      materi:{judul:"Nilai-Nilai Pancasila sebagai Identitas Nasional dalam Kehidupan Sehari-hari", subjudul:"Identitas nasional hidup ketika nilai Pancasila tercermin dalam sikap warga dan penyelenggaraan negara.", bagian:[
        {judul:"Pancasila sebagai Identitas Nasional", paragraf:["Identitas nasional adalah jati diri atau karakteristik bersama yang membedakan suatu bangsa dan menjadi perekat kehidupan masyarakatnya. Pancasila menjadi landasan nilai dan salah satu unsur penting identitas nasional Indonesia karena mencerminkan nilai ketuhanan, kemanusiaan, persatuan, demokrasi, dan keadilan yang menjadi pedoman kehidupan bangsa.","Identitas nasional Indonesia juga tampak dalam unsur lain, seperti Bahasa Indonesia, bendera Merah Putih, lagu kebangsaan Indonesia Raya, lambang negara Garuda Pancasila, semboyan Bhinneka Tunggal Ika, dan kebudayaan nasional. Unsur-unsur tersebut memperkuat jati diri bangsa dalam keberagaman."]},
        {judul:"Implementasi Subjektif", paragraf:["Implementasi subjektif adalah pelaksanaan nilai Pancasila oleh individu dalam perilaku sehari-hari. Nilai Pancasila perlu dihayati oleh warga negara dan penyelenggara negara ketika bersikap, mengambil keputusan, serta berhubungan dengan orang lain."], poin:["Bersikap jujur dan bertanggung jawab.","Menghormati perbedaan agama, suku, budaya, dan pendapat.","Bermusyawarah serta tidak memaksakan kehendak.","Berlaku adil, membantu sesama, dan menghargai hak orang lain."]},
        {judul:"Implementasi Objektif", paragraf:["Implementasi objektif adalah penjabaran nilai Pancasila dalam penyelenggaraan negara melalui peraturan perundang-undangan, kebijakan, dan tindakan lembaga negara. Dengan demikian, nilai Pancasila tidak hanya menjadi pedoman pribadi, tetapi juga harus tercermin dalam sistem dan kebijakan publik."], poin:["Peraturan yang melindungi hak asasi manusia dan menjamin persamaan di hadapan hukum.","Kebijakan yang menjamin kebebasan beragama dan menghormati keberagaman.","Pemerataan layanan publik serta kebijakan yang memperhatikan keadilan sosial."]},
        {judul:"Menerapkan Identitas Pancasila dalam Kehidupan Sehari-hari", paragraf:["Implementasi subjektif dan objektif saling berkaitan. Nilai yang dihayati individu perlu didukung oleh aturan dan penyelenggaraan negara yang sesuai. Sebaliknya, kebijakan yang baik membutuhkan warga yang memahami dan menjalankan nilai-nilai Pancasila.","Di lingkungan sekolah, identitas Pancasila dapat terlihat ketika peserta didik menghormati teman yang berbeda keyakinan, menolak perundungan, bekerja sama, bermusyawarah, serta membagi tugas secara adil. Dalam kehidupan digital, peserta didik juga perlu memeriksa informasi sebelum membagikannya dan tidak menyebarkan ujaran kebencian."]}

 "Sore itu Raka melihat beberapa anak tetangga mengelilingi Bima. Mereka menirukan cara bicaranya, menyuruhnya melakukan hal-hal yang jelas tidak ia inginkan, lalu mendorongnya sampai terjatuh, sambil tertawa dan merekam dengan ponsel. Salsa, teman Raka yang ikut melihat, berbisik, “Sudahlah, cuma bercanda. Jangan ikut campur, nanti kita yang kena masalah.” Seorang warga yang lewat berkata, “Itu urusan keluarga masing-masing.”",
 "Malam harinya video itu beredar di grup chat lingkungan dengan komentar tawa. Keesokan harinya warga terbelah. Sebagian menyalahkan ibu Bima yang dianggap “kurang mengawasi”. Sebagian lain marah kepada anak-anak itu dan mengusulkan agar foto serta identitas mereka disebarkan “supaya kapok”. Pak RT belum bisa dihubungi, sementara Raka masih menyimpan rasa tidak enak di hatinya."],
 fakta:["Seorang anak berusia 10 tahun penyandang Down syndrome di Kecamatan Rungkut, Surabaya, meninggal dunia setelah diduga mengalami kekerasan pada 12 September 2026 (VIVA Jatim). Kasus ini menjadi sorotan publik pada Oktober 2026.","Menurut pemberitaan, dugaan kekerasan tersebut melibatkan dua anak tetangganya. Polrestabes Surabaya menangani perkara bersama Bapas dan instansi terkait, dan kedua anak itu tidak ditahan setelah ada pembahasan dengan berbagai pihak (JPNN Jatim; Katadata).","Pemkot Surabaya memberikan pendampingan psikologis kepada keluarga korban dan keluarga anak yang diduga terlibat, serta mengimbau warga tidak menyebarkan foto anak yang ditetapkan sebagai pelaku (VIVA Jatim; JPNN Jatim).","Kemenkes dan Persatuan Orang Tua Anak dengan Down Syndrome (POTADS) mengecam perundungan dan menuntut nol toleransi terhadap kekerasan pada anak (ANTARA). Wakil Ketua Komisi VIII DPR mendesak penguatan perlindungan anak (RMOL).","Perkara masih dalam proses penanganan. Identitas korban dan anak-anak yang terlibat sengaja tidak dicantumkan."],
 sumber:[{m:"ANTARA",t:"Kemenkes dan POTADS kecam keras perundungan pada anak “down syndrome”",d:"1 November 2026",u:"https://www.antaranews.com/berita/5824463/kemenkes-dan-potads-kecam-keras-perundungan-pada-anak-down-syndrome"},{m:"RMOL",t:"Anak Down Syndrome Tewas Diduga Dibully, Komisi VIII DPR Desak Penguatan Perlindungan Anak",d:"19 Oktober 2026",u:"https://rmol.id/read/2026/10/19/725451/anak-down-syndrome-tewas-diduga-dibully-komisi-viii-dpr-desak-penguatan-perlindungan-anak"},{m:"VIVA Jatim",t:"Bocah Down Syndrome di Surabaya Meninggal diduga Akibat Bullying Anak Tetangga",d:"Oktober 2026",u:"https://jatim.viva.co.id/kabar/28463-bocah-down-syndrome-di-surabaya-meninggal-diduga-akibat-bullying-anak-tetangga"},{m:"VIVA Jatim",t:"Kasus Anak Down Syndrome Tewas, Pemkot Surabaya Beri Pendampingan Psikologis",d:"Oktober 2026",u:"https://jatim.viva.co.id/kabar/28498-kasus-anak-down-syndrome-tewas-pemkot-surabaya-beri-pendampingan-psikologis"},{m:"JPNN Jatim",t:"Pemkot Surabaya Imbau Warga Tak Sebar Foto Pelaku Kekerasan Anak Down Syndrome",d:"—",u:"https://jatim.jpnn.com/jatim-terkini/49652/pemkot-surabaya-imbau-warga-tak-sebar-foto-pelaku-kekerasan-anak-down-syndrome"},{m:"JPNN Jatim",t:"Dua Anak Pelaku Kekerasan yang Menewaskan Anak Down Syndrome Tak Ditahan, Ini Alasannya",d:"—",u:"https://jatim.jpnn.com/kriminal/49504/dua-anak-pelaku-kekerasan-yang-menewaskan-anak-down-syndrome-tak-ditahan-ini-alasannya"}],
 fod:[["Pemkot Surabaya memberikan pendampingan psikologis kepada keluarga korban maupun keluarga anak yang diduga terlibat.",0],["Kematian anak tersebut diduga berkaitan dengan kekerasan yang melibatkan anak-anak tetangganya.",1],["Perundungan terjadi karena orang tua korban kurang mengawasi anaknya.",2]],
 sit:"Bayangkan kamu berada di posisi Raka saat melihat Bima dikerumuni dan didorong. Apa yang akan kamu lakukan?",
 opts:[{t:"Segera mendekat, menghentikan anak-anak itu, membantu Bima berdiri, lalu menghubungi ibunya.",p:"Respons cepat dan langsung melindungi korban; menunjukkan keberanian membela kebenaran.",r:"Berisiko terjadi konfrontasi, apalagi jika jumlah mereka banyak; tanpa orang dewasa, masalah bisa memanas."},{t:"Menemani Bima ke tempat aman, lalu melaporkan kejadian ke Pak RT, orang tua atau sekolah anak-anak itu, dan layanan perlindungan anak, tanpa menyebarkan video.",p:"Melibatkan pihak berwenang dan menjaga martabat semua anak; penyelesaiannya berkelanjutan.",r:"Butuh waktu; selama menunggu, tindakan di tempat kejadian bisa terlambat."},{t:"Membicarakannya secara kekeluargaan dengan orang tua anak-anak itu agar diselesaikan antarwarga tanpa melibatkan pihak luar.",p:"Menjaga kerukunan dan hubungan baik antarwarga, serta mencegah anak-anak dicap buruk.",r:"Jika tidak tegas, korban tetap tidak terlindungi dan pembiaran dapat terulang."}],
 kw:["korban","pelaku","anak","perundungan","bullying","down syndrome","disabilitas","keluarga","sekolah","lapor","pendampingan","pembinaan","empati","tenggang rasa","rentan","martabat"],
 pb:{inti:"Masalahnya bukan sekadar “anak-anak bercanda”. Ada anak yang direndahkan karena kondisinya, kejadian yang didokumentasikan untuk ditertawakan, orang-orang yang memilih membiarkan, dan reaksi lanjutan berupa saling menyalahkan serta niat menyebarkan identitas anak.",
 sila:[["Sila 2","Inti kasus. Setiap manusia memiliki harkat dan martabat yang sama; tenggang rasa dan keberanian membela kebenaran adalah wujud nyatanya."],["Sila 5","Kelompok rentan berhak atas perlindungan yang adil. Keadilan sosial berarti lingkungan menyediakan rasa aman bagi semua anak."],["Sila 3","Kerukunan retak ketika perbedaan kondisi dijadikan bahan olok-olok, dan juga ketika warga terpecah dalam saling menghakimi."],["Sila 1","Setiap manusia adalah ciptaan Tuhan; merendahkan sesama bertentangan dengan penghormatan itu."],["Sila 4","Penyelesaian di lingkungan sebaiknya lewat musyawarah dan mekanisme yang jelas, bukan main hakim sendiri."]],
 tokoh:["Raka: berada pada titik penentu. Diam berarti ikut membiarkan; bertindak gegabah dapat membahayakan dirinya dan memperkeruh keadaan.","Salsa: ucapan “jangan ikut campur” menormalkan pembiaran. Rasa takut itu manusiawi, tetapi pembiaran memperpanjang penderitaan korban.","Warga yang berkata “urusan keluarga”: menggeser tanggung jawab bersama menjadi urusan satu rumah. Perlindungan anak adalah tanggung jawab keluarga, masyarakat, dan negara.","Warga yang ingin menyebar identitas anak-anak itu: niatnya mungkin membela korban, tetapi caranya melanggar martabat anak dan bisa melahirkan korban baru. Pada kasus nyata, Pemkot Surabaya mengimbau agar foto anak yang terlibat tidak disebarkan."],
 alt:["Dahulukan keselamatan dan rasa aman korban, lalu libatkan orang dewasa yang berwenang (orang tua, RT, sekolah, layanan perlindungan anak).","Simpan bukti seperlunya untuk pelaporan, tetapi jangan menyebarkan video atau identitas anak.","Dampingi korban dan keluarganya; beri pembinaan dan pendampingan juga kepada anak-anak yang terlibat sesuai usianya.","Bangun lingkungan inklusif melalui sosialisasi, kegiatan bersama, dan kesepakatan warga yang jelas."],
 pel:["Pembiaran adalah bagian dari masalah.","Membela korban tidak boleh dilakukan dengan merendahkan pihak lain, apalagi anak-anak.","Nilai Pancasila menuntut tindakan nyata, bukan hanya rasa simpati."]}},

{n:2,title:"Ketika Alam Menjadi Korban",tema:"Kebakaran hutan dan lahan, kabut asap, dan tanggung jawab bersama",sila:"Sila 2 • 3 • 4 • 5",
 ringkas:"Kabut asap menyelimuti desa, sekolah belajar daring, dan warga saling tuding soal siapa yang membakar. Saat api baru muncul, haruskah Nadia melapor?",
 story:[
 "Nadia, siswi kelas XI, tinggal di desa di tepi lahan gambut. Sudah dua minggu kabut asap pekat menyelimuti desanya. Sekolah belajar dari rumah, adiknya batuk-batuk terus, dan neneknya sulit bernapas. Banyak orang tua cemas, tetapi tidak sedikit yang tetap harus bekerja di luar rumah.",
 "Di balai desa warga berdebat. Sebagian menuding petani kecil yang membuka lahan dengan cara dibakar karena biaya membersihkan lahan tanpa bakar mahal. Pak Hasan, salah satu petani, berkata, “Kami hanya ingin menanam supaya keluarga bisa makan.” Sebagian lain curiga api juga berasal dari lahan milik perusahaan di dekat desa, tetapi belum ada bukti. Namun banyak warga menggantungkan penghasilan pada perusahaan itu, sehingga tidak ingin “mencari masalah”.",
 "Sore itu Nadia melihat asap tipis baru naik dari lahan kosong dekat sekolahnya. Di grup warga seseorang menulis, “Jangan buru-buru lapor, nanti petani kecil yang ditangkap, padahal belum tentu mereka.” Yang lain menjawab, “Kalau dibiarkan, api bisa menjalar ke permukiman.” Nadia membawa ponselnya dan harus memutuskan sesuatu."],
 fakta:["Kebakaran hutan dan lahan di Sumatera dan Kalimantan memicu kabut asap yang dampaknya melampaui batas wilayah (JawaPos, Oktober 2026). BMKG memantau potensi asap lintas batas dari Sumatera ke arah Semenanjung Malaysia dan Singapura pada 14 Oktober 2026 (Mongabay).","Pada 4 Oktober 2026 di Palembang, 29 penerbangan domestik dan dua penerbangan internasional mengalami keterlambatan akibat kabut asap (ANTARA Foto). Pemkot Palangka Raya memperpanjang status tanggap darurat karhutla hingga 9 November 2026 (Bisnis.com).","Sejumlah sekolah di wilayah terdampak sempat libur atau belajar daring (Mongabay, 26 September 2026).","Kementerian Kehutanan meminta masyarakat, petani, pekebun, hingga perusahaan tidak membuka lahan dengan cara membakar (JPNN). Pemerintah juga menjalankan operasi modifikasi cuaca dengan es kering (dry ice) di Sumatera Selatan pada 16–25 Oktober 2026 (Harian Jogja), sementara WALHI Sumsel meminta kabut asap diatasi dari akar masalahnya (JPNN).","Soal siapa yang bertanggung jawab masih menjadi perdebatan publik; cerita Nadia dan Pak Hasan adalah simulasi dan bukan kronologi peristiwa tertentu."],
 sumber:[{m:"Mongabay Indonesia",t:"Korban Kabut Asap Karhutla, Siapa yang Bertanggung Jawab?",d:"7 November 2026",u:"https://mongabay.co.id/2026/11/07/korban-kabut-asap-karhutla-siapa-yang-bertanggung-jawab/"},{m:"ANTARA Foto",t:"Penerbangan di Palembang terganggu kabut asap kebakaran hutan dan lahan",d:"5 Oktober 2026",u:"https://www.antaranews.com/foto/5771897/penerbangan-di-palembang-terganggu-kabut-asap-kebakaran-hutan-dan-lahan"},{m:"Bisnis.com",t:"Karhutla, Sebaran Asap dan Mitigasi Pemerintah",d:"19 Oktober 2026",u:"https://kabar24.bisnis.com/read/20261019/15/2013642/karhutla-sebaran-asap-dan-mitigasi-pemerintah"},{m:"Mongabay Indonesia",t:"Kebakaran Hutan Bahayakan Kesehatan Masyarakat dan Rugikan Ekonomi",d:"26 September 2026",u:"https://mongabay.co.id/2026/09/26/kebakaran-hutan-bahayakan-kesehatan-masyarakat-dan-rugikan-ekonomi/"},{m:"Harian Jogja",t:"Dry Ice vs Garam, Ini Perbedaan Metode OMC Atasi Kebakaran Hutan dan Lahan",d:"23 Oktober 2026",u:"https://news.harianjogja.com/r-1276159/dry-ice-vs-garam-ini-perbedaan-metode-omc-atasi-kebakaran-hutan-dan-lahan"},{m:"JPNN",t:"Kabut Asap Makin Pekat, Menhut Ungkap Perkembangan Penanganan Karhutla di Sumsel",d:"—",u:"https://www.jpnn.com/news/kabut-asap-makin-pekat-menhut-ungkap-perkembangan-penanganan-karhutla-di-sumsel"},{m:"JPNN",t:"WALHI Sumsel: Kabut Asap Tak Cukup Diatasi dengan Dry Ice",d:"—",u:"https://www.jpnn.com/news/walhi-sumsel-kabut-asap-tak-cukup-diatasi-dengan-dry-ice"}],
 fod:[["BMKG memantau potensi asap lintas batas dari Sumatera ke arah Semenanjung Malaysia dan Singapura pada 14 Oktober 2026.",0],["Asap tebal yang menyelimuti kawasan inti IKN diduga berasal dari kebakaran lahan di luar IKN.",1],["Operasi modifikasi cuaca saja sudah cukup untuk menyelesaikan masalah kabut asap.",2]],
 sit:"Bayangkan kamu berada di posisi Nadia saat melihat asap baru muncul di lahan kosong dekat sekolah. Apa yang akan kamu lakukan?",
 opts:[{t:"Segera melapor ke kepala desa dan posko penanganan karhutla atau BPBD dengan menyertakan lokasi dan foto, tanpa menuduh siapa pun sebagai pelaku.",p:"Cepat, berbasis data, dan menjaga agar pelaku tidak dituduh sebelum terbukti; api bisa segera ditangani petugas.",r:"Sebagian warga mungkin menganggapnya “mencari masalah”; penanganan bergantung pada kecepatan respons petugas."},{t:"Mengajak teman dan warga memadamkan api secara gotong royong dengan peralatan seadanya sambil menunggu petugas.",p:"Menunjukkan kepedulian dan gotong royong; api kecil lebih mudah dipadamkan di awal.",r:"Berbahaya bagi keselamatan tanpa pelatihan dan alat; api di lahan gambut sulit dipadamkan dan asapnya merugikan kesehatan."},{t:"Mengajak warga, petani, dan perwakilan perusahaan bermusyawarah dahulu untuk menyepakati cara membuka lahan tanpa bakar dan pembagian tanggung jawab sebelum melapor.",p:"Mencari solusi jangka panjang yang adil dan melibatkan semua pihak, termasuk petani kecil.",r:"Memakan waktu; selama musyawarah api bisa membesar dan membahayakan permukiman."}],
 kw:["asap","api","lahan","lapor","petani","perusahaan","kesehatan","lingkungan","musyawarah","gotong royong","aturan","bakar","tanggung jawab","adil","warga","hutan"],
 pb:{inti:"Konflik tiga kepentingan: kesehatan dan keselamatan warga, kebutuhan ekonomi petani dan warga yang bergantung pada perusahaan, serta kelestarian lingkungan. Persoalan bertambah rumit karena saling tuding tanggung jawab, penyebab yang belum pasti, dan rasa takut jika melapor akan menyudutkan petani kecil.",
 sila:[["Sila 2","Kesehatan dan keselamatan warga, terutama anak, lansia, dan penderita gangguan napas, adalah soal kemanusiaan. Martabat petani kecil juga perlu dihormati."],["Sila 3","Asap tidak mengenal batas desa maupun negara. Kepentingan bersama harus didahulukan di atas kepentingan golongan."],["Sila 4","Aturan dan penyelesaian sebaiknya disepakati melalui musyawarah yang melibatkan semua pihak."],["Sila 5","Keadilan: aturan berlaku sama bagi petani dan perusahaan; beban tidak ditimpakan hanya pada yang lemah. Gotong royong menjaga lingkungan adalah wujud nyatanya."],["Sila 1","Alam adalah amanah yang harus dijaga, bukan sekadar sumber keuntungan."]],
 tokoh:["Nadia: memegang informasi awal yang berharga. Melapor dengan data tanpa menuduh adalah cara menjaga keselamatan sekaligus keadilan.","Pak Hasan: motif ekonominya dapat dipahami, tetapi membakar lahan merugikan banyak orang. Ia perlu didampingi alternatif (alat dan pengetahuan membuka lahan tanpa bakar), bukan hanya dihukum, dan juga tidak lepas dari tanggung jawab.","Perusahaan: jika terbukti lalai, tanggung jawabnya besar. Namun pada cerita ini baru ada kecurigaan, sehingga semua pihak perlu menunggu pembuktian dan tidak saling menuduh.","Warga yang berkata “jangan lapor”: kekhawatirannya akan keadilan bagi petani kecil beralasan, tetapi tidak melapor justru membahayakan lebih banyak orang termasuk petani itu sendiri."],
 alt:["Lapor cepat dengan data lokasi dan foto; serahkan pembuktian penyebab kepada pihak berwenang.","Pemadaman awal dilakukan oleh pihak yang terlatih; warga membantu dengan cara yang aman (mengevakuasi kelompok rentan, menyiapkan masker dan ruang bersih).","Musyawarah desa untuk menyepakati cara membuka lahan tanpa bakar disertai dukungan bagi petani kecil.","Penegakan aturan yang adil kepada semua pihak, disertai pengawasan yang transparan."],
 pel:["Kepentingan ekonomi dan keselamatan bersama perlu ditimbang secara adil, bukan dipertentangkan.","Melapor dengan data tanpa menuduh adalah bentuk tanggung jawab warga.","Menjaga lingkungan adalah gotong royong lintas pihak."]}},

{n:3,title:"Antara Kebebasan Berpendapat dan Etika Digital",tema:"Media sosial, penyebaran informasi, kritik, dan tanggung jawab warga negara",sila:"Sila 2 • 3 • 4",
 ringkas:"Sebuah video viral menyebut asap membuat siswa dilarikan ke rumah sakit, tetapi sumbernya belum jelas. Mana yang harus didahulukan: kecepatan atau kebenaran?",
 story:[
 "Dimas, siswa kelas XI, melihat video viral di media sosial. Narasinya menyebut tiga siswa di kotanya dilarikan ke rumah sakit akibat kabut asap dan “pemerintah daerah menutup-nutupinya”. Video itu tidak mencantumkan sumber, lokasi, atau tanggal. Temannya, Farah, sudah membagikannya ke puluhan grup dengan keterangan “Sebarkan! Biar semua tahu!”",
 "Kolom komentar ramai. Ada yang menulis, “Jangan percaya apa pun dari pemerintah.” Ada yang membalas, “Ini hoaks pembuat onar, harus dihapus.” Dimas mencoba mencari informasi dan menemukan dua video serupa, satu di antaranya tampak berasal dari daerah lain dan dari waktu yang berbeda. Namun ia juga menemukan laporan resmi bahwa kualitas udara di kotanya memang sedang buruk.",
 "Esoknya unggahan Farah tidak lagi muncul di beranda banyak orang, tanpa penjelasan jelas dari platform. Farah marah, “Ini pembungkaman kritik!” Sebagian temannya setuju. Sebagian lain berkata, “Platform hanya menegakkan aturan soal hoaks.” Dimas bingung: informasi itu mungkin benar sebagian, mungkin juga keliru, dan ia tidak tahu siapa yang sebenarnya meminta pembatasan."],
 fakta:["Remotivi dan SAFEnet mencatat 127 konten mengalami moderasi di media sosial hingga 8 November 2026; 94 di antaranya (74 persen) dikaitkan dengan permintaan Kementerian Komunikasi dan Digital (Komdigi). Komdigi mengajak kedua lembaga mencocokkan data (JawaPos, 13 November 2026).","Komdigi menyatakan tidak pernah meminta platform menurunkan atau membatasi konten tentang karhutla, menekankan bahwa moderasi dilakukan pada konten dan bukan akunnya, serta mendorong transparansi alasan moderasi dan mekanisme banding (Bisnis.com, 23 Oktober 2026; Katadata, 29 Oktober 2026).","Sejumlah kreator mengeluhkan dugaan pembatasan konten tentang karhutla. Komdigi menyebut pembatasan bisa saja berkaitan dengan pedoman komunitas platform atau algoritma (Katadata, 29 Oktober 2026). SAFEnet menyoroti bahwa pengaruh pemerintah dapat bekerja lewat berbagai jalur, termasuk pelabelan hoaks (JawaPos, 21 Oktober 2026).","Komdigi menetapkan aturan agar platform menurunkan konten disinformasi atau hoaks yang diperintahkan dalam waktu 4 jam; menurut Komdigi aturan itu hanya berlaku untuk konten mendesak dan berisiko tinggi (Bisnis.com, 7 April 2026; InfoPublik).","Perdebatan ini masih berlangsung dan melibatkan banyak sudut pandang. Kasus Dimas dan Farah adalah simulasi, bukan peristiwa nyata tertentu."],
 sumber:[{m:"JawaPos",t:"127 Konten Kritis Dibatasi di Medsos, 74 % Dikaitkan dengan Permintaan Komdigi",d:"13 November 2026",u:"https://www.jawapos.com/nasional/2611130256/127-konten-kritis-dibatasi-di-medsos-74-dikaitkan-dengan-permintaan-komdigi"},{m:"Bisnis.com",t:"Minta Transparansi AI, Komdigi: Hak Publik atas Informasi Harus Dilindungi",d:"23 Oktober 2026",u:"https://teknologi.bisnis.com/read/20261023/101/2015200/minta-transparansi-ai-komdigi-hak-publik-atas-informasi-harus-dilindungi"},{m:"Katadata",t:"Konten Karhutla Dibatasi, Komdigi: Masyarakat Bisa Ajukan Banding ke Platform",d:"29 Oktober 2026",u:"https://katadata.co.id/digital/teknologi/6ae2e0d57e7fd/konten-karhutla-dibatasi-komdigi-masyarakat-bisa-ajukan-banding-ke-platform"},{m:"JawaPos",t:"Konten Karhutla dan Demo Diduga Kena Shadow Banning, SAFEnet Soroti Peran Komdigi di Medsos",d:"21 Oktober 2026",u:"https://www.jawapos.com/teknologi/2610210307/konten-karhutla-dan-demo-diduga-kena-shadow-banning-safenet-soroti-peran-komdigi-di-medsos"},{m:"Bisnis.com",t:"Google - Meta Cs Wajib ‘Takedown’ Hoaks Maksimal 4 Jam Setelah Perintah Komdigi",d:"7 April 2026",u:"https://teknologi.bisnis.com/read/20260407/101/1964828/google-meta-cs-wajib-takedown-hoaks-maksimal-4-jam-setelah-perintah-komdigi"},{m:"InfoPublik",t:"Kemkomdigi Tegaskan Aturan Penurunan Konten Empat Jam Hanya Berlaku untuk Konten Mendesak dan Berisiko Tinggi",d:"—",u:"https://infopublik.id/index.php/kategori/nasional-sosial-budaya/995294/kemkomdigi-tegaskan-aturan-penurunan-konten-empat-jam-hanya-berlaku-untuk-konten-mendesak-dan-berisiko-tinggi"}],
 fod:[["Remotivi dan SAFEnet mencatat 127 konten kritis mengalami moderasi hingga 8 November 2026, dan 94 di antaranya dikaitkan dengan permintaan Komdigi.",0],["Pembatasan jangkauan sebagian konten karhutla diduga berkaitan dengan pedoman komunitas atau algoritma platform.",1],["Pemerintah tidak boleh membatasi konten apa pun di media sosial.",2]],
 sit:"Bayangkan kamu berada di posisi Dimas. Video itu belum terverifikasi, tetapi kualitas udara memang buruk dan Farah merasa dibungkam. Apa yang akan kamu lakukan?",

const KEY="misiPancasila_v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const wc=s=>(String(s).trim().match(/\S+/g)||[]).length;
function blank(){return{c:[0,1,2].map(()=>({b:["","","",""],f:[-1,-1,-1],si:[],sa:"",sn:"",d:["","","",""],e:-1,ea:"",er:""})),view:"intro",ci:0,done:false,rf:["","","",""],nm:"",rfSaved:false}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.c)&&o.c.length===3)return Object.assign(blank(),o)}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
if(S.view==="result"&&!S.done)S.view="list";

/* ---------- Validasi kelengkapan ---------- */
function missing(i){const c=S.c[i],m=[];
  c.b.forEach((x,k)=>{if(wc(x)<MIN)m.push("B. Pertanyaan pemantik "+(k+1))});
  if(c.f.some(v=>v<0))m.push("B. Pernyataan fakta/dugaan/opini");
  if(!c.si.length)m.push("C. Pilih minimal satu sila");
  if(wc(c.sa)<MIN)m.push("C. Alasan memilih sila");
  if(wc(c.sn)<MIN)m.push("C. Nilai Pancasila yang seharusnya diterapkan");
  c.d.forEach((x,k)=>{if(wc(x)<MIN)m.push("D. Pertanyaan analisis "+(k+1))});
  if(c.e<0)m.push("E. Pilihan tindakan");
  if(wc(c.ea)<MIN)m.push("E. Alasan pilihan");
  if(wc(c.er)<MIN)m.push("E. Risiko dan cara mengatasinya");
  return m}
const TOTAL=15;
const pct=i=>Math.round((TOTAL-Math.min(TOTAL,missing(i).length>0?countMissingUnits(i):0))/TOTAL*100);
function countMissingUnits(i){const c=S.c[i];let u=0;
  c.b.forEach(x=>{if(wc(x)<MIN)u++});if(c.f.some(v=>v<0))u++;if(!c.si.length)u++;if(wc(c.sa)<MIN)u++;if(wc(c.sn)<MIN)u++;
  c.d.forEach(x=>{if(wc(x)<MIN)u++});if(c.e<0)u++;if(wc(c.ea)<MIN)u++;if(wc(c.er)<MIN)u++;return u}
const doneN=()=>[0,1,2].filter(i=>missing(i).length===0).length;

/* ---------- Tampilan ---------- */
function topbar(){const n=doneN();return `<div class="top"><span class="lbl">🔎 MISI INVESTIGASI</span><span class="lbl">KASUS SELESAI ${n} / 3</span></div><div class="bar" aria-hidden="true"><i style="width:${n/3*100}%"></i></div>`}
function draw(){const a=$("#app");let h="";
  if(S.view==="intro")h=vIntro();else if(S.view==="list")h=topbar()+vList();else if(S.view==="case")h=topbar()+vCase(S.ci);else h=vResult();
  a.innerHTML=`<div class="in">${h}</div>`;window.scrollTo({top:0});if(S.view==="result"&&S.fresh){S.fresh=false;confetti(Math.round(15+resultData().pct*.8))}}
function vIntro(){return `<section class="card intro"><div class="guide">${guideImg()}<div class="bubble">Halo, Detektif! Aku Oyen. Tiga kasus nyata menantimu. Amati dulu, baru simpulkan!</div></div>
<span class="tag">🔎 EKSPLORASI KASUS INTERAKTIF</span><h1>MISI INVESTIGASI PANCASILA</h1><p class="tagline">“Amati Kasusnya, Pahami Masalahnya, Temukan Solusinya!”</p>
<p class="open">Setiap masalah memiliki cerita. Setiap tindakan memiliki konsekuensi. Mampukah kamu menemukan solusi berdasarkan nilai-nilai Pancasila?</p>
<div class="facts"><span class="fact">📂 3 Kasus Aktual 2026</span><span class="fact">🧠 Level: Menantang (Fase F)</span><span class="fact">💾 Jawaban Tersimpan Otomatis</span></div>
<ol class="howto"><b>PETUNJUK</b><li>Buka kasus satu per satu. Ceritanya adalah simulasi yang terinspirasi peristiwa nyata; fakta dan sumbernya dicantumkan.</li><li>Isi semua bagian A–E. Kolom tulisan wajib minimal ${MIN} kata. Kasus ditandai selesai bila semua bagian terisi.</li><li>Tidak ada pembahasan di tengah pengerjaan. Pembahasan muncul setelah kamu mengakhiri investigasi.</li><li>Penilaian memakai rubrik 5 aspek dengan skala 1–4. Pilihan tindakanmu dinilai dari alasannya, bukan dari pilihannya.</li></ol>
<button class="btn" data-act="start">▶ MULAI INVESTIGASI</button></section>`}
function vList(){const n=doneN();return `<h2 class="tag" style="font-size:.7rem">📂 DAFTAR KASUS</h2><div class="cases">${C.map((k,i)=>{const p=pct(i),ok=missing(i).length===0;return `<article class="card case">${ok?'<span class="done-b">✔ SELESAI</span>':""}<div class="pic" style="background:${BGS[i]}">${casePic(i)}</div><div class="bd"><span class="tag" style="align-self:flex-start;margin:0">MISI ${k.n}</span><h3>${k.title}</h3><div class="tm">${k.tema}</div><p>${k.ringkas}</p><div class="mini" title="${p}%"><i style="width:${p}%"></i></div><button class="btn ${ok?"y":""}" data-act="open" data-i="${i}">${ok?"TINJAU KASUS":p>0?"LANJUTKAN KASUS":"BUKA KASUS"}</button></div></article>`}).join("")}</div>
<div style="text-align:center;margin-top:8px"><button class="btn g" data-act="finish" ${n<3?"disabled":""}>🏁 AKHIRI INVESTIGASI</button>${n<3?`<p style="color:#fff;font-weight:800;text-shadow:1px 1px 0 #222;margin-top:10px">Selesaikan ketiga kasus untuk membuka tombol ini.</p>`:""}</div>
<div style="text-align:center;margin-top:18px"><button class="btn y" data-act="reset">↻ ULANGI INVESTIGASI</button></div>`}
function ta(path,val,ph){return `<textarea data-f="${path}" placeholder="${ph||"Tuliskan jawabanmu di sini..."}">${esc(val)}</textarea><small class="cnt ${wc(val)>=MIN?"ok":""}" data-c="${path}">${wc(val)} kata (minimal ${MIN})</small>`}
function vCase(i){const k=C[i],c=S.c[i];const Q=["Apa permasalahan utama dalam kasus tersebut?","Siapa saja pihak yang terlibat, dan apa kepentingan masing-masing?","Mengapa permasalahan tersebut dapat terjadi? (cari penyebab, bukan hanya kejadiannya)","Apa dampaknya jika persoalan tidak diselesaikan, dan siapa yang paling dirugikan?"];
 const D=["Menurutmu, tindakan siapa yang paling perlu diperbaiki dalam kasus tersebut? Jelaskan alasannya.","Bagaimana seharusnya permasalahan tersebut diselesaikan berdasarkan nilai Pancasila?","Jika kamu berada dalam situasi tersebut, tindakan apa yang akan kamu lakukan?","Apa akibat yang mungkin terjadi jika solusi yang kamu tawarkan diterapkan? Pertimbangkan akibat bagi berbagai pihak."];
 return `<article class="card"><div class="chead"><span class="tag" style="margin:0">MISI ${k.n}</span><h2>${k.title}</h2></div><p style="font-weight:800;margin-bottom:6px">${k.tema}</p>
 <div class="stat ${missing(i).length?"":"ok"}" id="stat">${statTxt(i)}</div>
 <h3 class="sect">A. CERITA KASUS</h3><div class="story"><span class="simlab">📖 SIMULASI PEMBELAJARAN (tokoh dan kronologi cerita adalah rekaan)</span>${k.story.map(p=>`<p>${p}</p>`).join("")}</div>
 <div class="fakta"><b class="t">📰 FAKTA NYATA YANG MENJADI INSPIRASI</b><ul>${k.fakta.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <div class="src"><b>Sumber berita dan rujukan:</b><ol>${k.sumber.map(s=>`<li>${s.m}, “${s.t}”, ${s.d}. <a href="${s.u}" target="_blank" rel="noopener noreferrer">${s.u}</a></li>`).join("")}</ol></div>
 <p class="note">ℹ️ Bedakan fakta terkonfirmasi, dugaan, dan opini. Informasi dapat berkembang; periksa sumber terbaru untuk perkembangan kasus.</p>
 <h3 class="sect" style="margin-top:24px">B. AMATI PERMASALAHANNYA</h3>${Q.map((q,j)=>`<div class="fld"><label class="q">${j+1}. ${q}</label>${ta("b."+j,c.b[j])}</div>`).join("")}
 <div class="fld"><label class="q">5. Latihan menyaring informasi: tentukan jenis setiap pernyataan berikut.</label>${k.fod.map((x,j)=>`<div class="fdo"><span>${j+1}. ${x[0]}</span><select data-fdo="${j}" aria-label="Jenis pernyataan ${j+1}"><option value="-1">Pilih jenis...</option>${FDO.map((o,m)=>`<option value="${m}" ${c.f[j]===m?"selected":""}>${o}</option>`).join("")}</select></div>`).join("")}</div>
 <h3 class="sect" style="margin-top:24px">C. TEMUKAN NILAI PANCASILA</h3><div class="fld"><label class="q">Sila manakah yang berkaitan dengan kasus ini? (boleh lebih dari satu)</label><div class="silas">${SILA.map((s,j)=>`<label class="sl ${c.si.includes(j)?"sel":""}"><input type="checkbox" data-si="${j}" ${c.si.includes(j)?"checked":""}> ${s.split(" – ")[0]}: ${s.split(" – ")[1].length>34?s.split(" – ")[1].slice(0,34)+"...":s.split(" – ")[1]}</label>`).join("")}</div></div>
 <div class="fld"><label class="q">Jelaskan alasan kamu memilih sila tersebut. Hubungkan dengan bagian cerita yang kamu amati.</label>${ta("sa",c.sa)}</div>
 <div class="fld"><label class="q">Nilai Pancasila apa yang seharusnya diterapkan oleh para tokoh dalam kasus ini?</label>${ta("sn",c.sn)}</div>
 <h3 class="sect" style="margin-top:24px">D. ANALISIS DAN BERIKAN SOLUSI</h3>${D.map((q,j)=>`<div class="fld"><label class="q">${j+1}. ${q}</label>${ta("d."+j,c.d[j])}</div>`).join("")}
 <h3 class="sect" style="margin-top:24px">E. TANTANGAN KEPUTUSAN</h3><div class="scn">🎯 ${k.sit}</div><p style="font-weight:700;margin-bottom:10px">Ketiga pilihan berikut masuk akal dan masing-masing memiliki kelebihan serta risiko. Pilih satu, lalu pertanggungjawabkan.</p>
 ${k.opts.map((o,j)=>`<label class="dec ${c.e===j?"sel":""}"><input type="radio" name="e${i}" data-e="${j}" ${c.e===j?"checked":""}><b>PILIHAN ${"ABC"[j]}</b>${o.t}</label>`).join("")}
 <div class="fld"><label class="q">Mengapa kamu memilih tindakan tersebut? Kaitkan dengan nilai Pancasila.</label>${ta("ea",c.ea)}</div>
 <div class="fld"><label class="q">Apa risiko dari pilihanmu, dan bagaimana kamu akan mengatasinya?</label>${ta("er",c.er)}</div>
 <div class="warn" id="warn"></div>
 <div class="navb"><button class="btn y" data-act="prev" ${i===0?"disabled":""}>◀ KASUS SEBELUMNYA</button><button class="btn" data-act="list">📂 DAFTAR KASUS</button>${i<2?`<button class="btn y" data-act="next">KASUS SELANJUTNYA ▶</button>`:`<button class="btn g" data-act="finish">🏁 AKHIRI INVESTIGASI</button>`}</div></article>`}
function statTxt(i){const m=missing(i);return m.length?`📝 Kelengkapan: ${pct(i)}%. Belum lengkap: ${m.length} bagian. Jawabanmu tersimpan otomatis.`:"✔ Kasus ini sudah lengkap. Kamu masih boleh mengubah jawabanmu sebelum mengakhiri investigasi."}

/* ---------- Penilaian (rubrik transparan) ---------- */
const cnt=(t,l)=>{t=String(t).toLowerCase();return l.filter(x=>t.includes(x)).length};
function ev(i){const c=S.c[i],K=C[i],w=wc;const fo=c.f.filter((v,j)=>v===K.fod[j][1]).length;
 const R=[["Mengidentifikasi masalah",[["Keempat pertanyaan pemantik dijawab minimal 10 kata",c.b.every(x=>w(x)>=10)],["Minimal 2 dari 3 pernyataan fakta/dugaan/opini tepat ("+fo+"/3)",fo>=2],["Jawaban masalah utama minimal 20 kata",w(c.b[0])>=20]]],
 ["Menghubungkan masalah dengan nilai Pancasila",[["Memilih minimal 2 sila",c.si.length>=2],["Alasan pemilihan sila minimal 25 kata",w(c.sa)>=25],["Penjelasan nilai yang seharusnya diterapkan minimal 20 kata",w(c.sn)>=20]]],
 ["Menganalisis tindakan dan dampak",[["Analisis tindakan tokoh minimal 20 kata",w(c.d[0])>=20],["Uraian akibat solusi minimal 20 kata",w(c.d[3])>=20],["Memuat minimal 2 kata sebab-akibat (karena, sehingga, dampak, dst.)",cnt(c.d[0]+" "+c.d[3],CAUS)>=2]]],
 ["Menawarkan solusi",[["Solusi menurut nilai Pancasila minimal 25 kata",w(c.d[1])>=25],["Tindakan pribadi minimal 20 kata",w(c.d[2])>=20],["Memuat minimal 2 istilah kunci kasus",cnt(c.d[1]+" "+c.d[2],K.kw)>=2]]],
 ["Memberi alasan yang logis",[["Alasan pilihan tindakan minimal 25 kata",w(c.ea)>=25],["Alasan memuat kata penalaran (karena, agar, sehingga, dst.)",cnt(c.ea,CAUS)>=1],["Risiko dan cara mengatasinya minimal 15 kata",w(c.er)>=15]]]];
 return R.map(([n,ind])=>({n,ind,s:1+ind.filter(x=>x[1]).length}))}
function resultData(){const E=[0,1,2].map(ev);const total=E.reduce((a,e)=>a+e.reduce((x,y)=>x+y.s,0),0);const p=Math.round(total/60*100);
 let g,m,md;if(p>=90){g="DETEKTIF PANCASILA – Sang Penjaga Nilai!";m="Luar biasa! Analisismu lengkap dan terstruktur. Teruslah menjadi penjaga nilai di lingkunganmu.";md="🏆"}
 else if(p>=80){g="ANALIS PANCASILA – Pemikir Hebat!";m="Hebat! Pemikiranmu sudah tajam. Perkuat bagian yang masih bisa dikembangkan.";md="🥇"}
 else if(p>=70){g="PENJELAJAH NILAI – Terus Berkembang!";m="Bagus! Kamu sudah di jalur yang tepat. Tambahkan alasan dan contoh agar analisismu makin kuat.";md="🥈"}
 else if(p>=60){g="CALON INVESTIGATOR – Terus Berlatih!";m="Kamu sudah berusaha. Coba kembangkan jawabanmu dengan alasan yang lebih rinci dan hubungan sebab-akibat.";md="🥉"}
 else{g="INVESTIGATOR PEMULA – Jangan Berhenti Belajar!";m="Setiap detektif hebat dimulai dari langkah pertama. Baca pembahasan, lalu coba perdalam jawabanmu.";md="🌱"}
 return{E,total,pct:p,g,m,md}}

/* ---------- Halaman hasil ---------- */
function vResult(){const R=resultData();
 const tbl=`<div class="tw"><table><thead><tr><th>ASPEK RUBRIK</th>${C.map(k=>`<th>KASUS ${k.n}</th>`).join("")}</tr></thead><tbody>${R.E[0].map((a,j)=>`<tr><td>${j+1}. ${a.n}</td>${R.E.map(e=>`<td class="lv${e[j].s}">${e[j].s} – ${LV[e[j].s]}</td>`).join("")}</tr>`).join("")}<tr><td><b>Jumlah (maks. 20 per kasus)</b></td>${R.E.map(e=>`<td><b>${e.reduce((x,y)=>x+y.s,0)}</b></td>`).join("")}</tr></tbody></table></div>`;
 const sum=C.map((k,i)=>{const c=S.c[i],e=R.E[i];return `<details ${i===0?"open":""}><summary>📋 RINGKASAN JAWABAN & UMPAN BALIK – KASUS ${k.n}: ${k.title.toUpperCase()}</summary><div>

 <p style="margin-top:8px"><i>Tidak ada satu pilihan yang mutlak benar. Penilaian melihat kelengkapan dan kejelasan alasanmu.</i></p>

 <p><b>Fakta/dugaan/opini:</b> ${k.fod.map((x,j)=>`${j+1}) kamu: ${c.f[j]>=0?FDO[c.f[j]]:"-"}, seharusnya: ${FDO[x[1]]}`).join(" • ")}</p>
 <h4>Indikator rubrik</h4>${e.map(a=>`<p><b>${a.n}: ${a.s}/4 (${LV[a.s]})</b></p><ul class="ind">${a.ind.map(x=>`<li class="${x[1]?"y":"n"}">${x[1]?"✔":"✖"} ${x[0]}</li>`).join("")}</ul>`).join("")}
 <p class="note">💬 Umpan balik: ${fb(e)}</p></div></details>`}).join("");

 return `<section class="card res"><div class="guide" style="margin-bottom:0">${guideImg()}</div><span class="tag">🔎 HASIL MISI INVESTIGASIMU!</span><div><span class="medal">${R.md}</span></div><div class="score">${R.pct}</div><p style="font-weight:800">dari skor maksimal 100</p><div class="gelar">${R.g}</div><p style="font-weight:700;max-width:580px;margin:0 auto">${R.m}</p>
 <div class="stats"><div><b>3 / 3</b>Kasus Diselesaikan</div><div><b>${R.total} / 60</b>Total Poin Rubrik</div><div><b>${R.pct}</b>Skor Akhir</div></div>
 <p class="note" style="text-align:left">ℹ️ <b>Cara penilaian:</b> setiap kasus dinilai pada 5 aspek (skala 1–4: 4 Sangat Baik, 3 Baik, 2 Cukup, 1 Perlu Dikembangkan). Skor tiap aspek = 1 + jumlah indikator yang terpenuhi (maks. 3). Skor akhir = total poin ÷ 60 × 100. Sistem ini hanya memeriksa kelengkapan, panjang, dan beberapa kata kunci pada jawabanmu. Sistem <u>tidak</u> menilai mutu argumen secara mendalam. Unduh jawabanmu dan diskusikan dengan gurumu untuk penilaian yang lebih tepat.</p><div class="navb noprint" style="margin-top:14px"><button class="btn g" data-act="print">🖨 CETAK HASIL KASUS</button></div><p class="noprint" style="margin-top:14px;background:#FFF8E7;border:3px solid #222;border-radius:12px;padding:10px 14px;font-weight:700;font-size:.85rem;color:#243B64;text-align:left">🐱 Meong~ Kalau mau cetak, lebih baik pakai <b>Chrome</b> yah! 🐾</p></section>
 <h2 class="sect">📊 RUBRIK PENILAIAN</h2><div class="card">${tbl}</div>
 <h2 class="sect">📝 RINGKASAN JAWABAN & UMPAN BALIK</h2>${sum}

 <section class="card" id="refl"><span class="tag">📝 REFLEKSI</span><h2 style="font-size:clamp(.75rem,2.4vw,1.05rem);color:var(--mario-red)">APA YANG AKU PELAJARI DARI KASUS INI?</h2><p style="font-weight:600;margin-top:8px">Refleksi tidak diberi skor benar atau salah. Tulislah dengan jujur.</p>
 <div class="fld"><label class="q" for="nm">Namamu (opsional)</label><input id="nm" type="text" data-nm="1" value="${esc(S.nm)}" style="width:100%;padding:12px;border:3px solid #222;border-radius:10px" placeholder="Tulis namamu"></div>
 ${RF.map((q,j)=>`<div class="fld"><label class="q">${j+1}. ${q}</label><textarea data-rf="${j}" placeholder="Tuliskan jawabanmu di sini...">${esc(S.rf[j])}</textarea></div>`).join("")}
 <div class="navb noprint"><button class="btn" data-act="saverf">💾 SIMPAN REFLEKSI</button><button class="btn y" data-act="dl">⬇ UNDUH HASIL REFLEKSI</button><button class="btn g" data-act="print">🖨 CETAK / PDF</button></div><p class="noprint" style="margin-top:14px;background:#FFF8E7;border:3px solid #222;border-radius:12px;padding:10px 14px;font-weight:700;font-size:.85rem;color:#243B64;text-align:left">🐱 Meong~ Kalau mau cetak, lebih baik pakai <b>Chrome</b> yah! 🐾</p>
 <div class="stat ok ${S.rfSaved?"":"hidden"}" id="rfmsg">🌟 Refleksimu tersimpan di perangkat ini. Terima kasih sudah jujur pada dirimu sendiri. Nilai Pancasila tumbuh dari keputusan-keputusan kecil yang kamu ambil setiap hari. Semangat, Detektif Nilai!</div></section>
 <div style="text-align:center" class="noprint"><button class="btn y" data-act="reset">↻ ULANGI INVESTIGASI</button></div>`}
function casePrint(){
 const R=resultData();const br=x=>esc(x==null?"":x).replace(/\n/g,"<br>");
 const tgl=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
 const box=(l,v)=>'<p><b>'+l+'</b></p><div class="p-a">'+br(v)+'</div>';

 b+='<h2>Rubrik Penilaian</h2><table><thead><tr><th>Aspek</th>'+C.map(k=>'<th>Kasus '+k.n+'</th>').join("")+'</tr></thead><tbody>'+R.E[0].map((a,j)=>'<tr><td>'+(j+1)+'. '+a.n+'</td>'+R.E.map(e=>'<td>'+e[j].s+' \u2013 '+LV[e[j].s]+'</td>').join("")+'</tr>').join("")+'<tr><td><b>Jumlah (maks. 20 per kasus)</b></td>'+R.E.map(e=>'<td><b>'+e.reduce((x,y)=>x+y.s,0)+'</b></td>').join("")+'</tr></tbody></table>';
 C.forEach((k,i)=>{const c=S.c[i],e=R.E[i];

  b+='<p><b>Sila yang dikaitkan:</b> '+(c.si||[]).slice().sort().map(x=>"Sila "+(x+1)).join(", ")+'</p>';

  b+=box("Analisis tindakan tokoh",c.d[0])+box("Solusi menurut nilai Pancasila",c.d[1])+box("Tindakan pribadi",c.d[2])+box("Akibat dari solusi",c.d[3]);
  b+='<p><b>Pilihan tindakan:</b> '+"ABC"[c.e]+'. '+k.opts[c.e].t+'</p>'+box("Alasan pilihan",c.ea)+box("Risiko dan cara mengatasinya",c.er);
  b+='<h3>Indikator rubrik</h3>'+e.map(a=>'<p><b>'+a.n+': '+a.s+'/4 ('+LV[a.s]+')</b></p><ul>'+a.ind.map(x=>'<li>'+(x[1]?"\u2714":"\u2716")+' '+x[0]+'</li>').join("")+'</ul>').join("");
  b+='<p><b>Umpan balik:</b> '+fb(e)+'</p>';
 });
 b+='<h2>Refleksi</h2>'+RF.map((q,j)=>box((j+1)+'. '+q,(S.rf[j]||"").trim()||"-")).join("");
 RBP.paper(root,{title:"Hasil Eksplorasi Kasus Pancasila",file:"hasil-eksplorasi-kasus-pancasila",html:b});
}
function fb(e){const miss=[];e.forEach(a=>a.ind.forEach(x=>{if(!x[1])miss.push(x[0].replace(/ \(\d\/3\)/,""))}));
 return miss.length?"Agar lebih kuat, coba perkuat bagian ini: "+miss.slice(0,3).join("; ")+".":"Semua indikator terpenuhi. Pertahankan, dan terus uji argumenmu dengan sudut pandang pihak lain."}

/* ---------- Unduh hasil ---------- */
function txt(){const R=resultData();let t=`HASIL MISI INVESTIGASI PANCASILA\nRuang Belajar Pancasila • Kelas XI SMA\nNama: ${S.nm.trim()||"-"}\nTanggal: ${new Date().toLocaleDateString("id-ID")}\nSkor: ${R.pct}/100 – ${R.g}\n\n`;
 C.forEach((k,i)=>{const c=S.c[i];t+=`==== KASUS ${k.n}: ${k.title} ====\n`;
  c.b.forEach((x,j)=>t+=`B${j+1}: ${x}\n`);t+=`Sila: ${c.si.map(x=>x+1).join(", ")}\nAlasan sila: ${c.sa}\nNilai seharusnya: ${c.sn}\n`;
  c.d.forEach((x,j)=>t+=`D${j+1}: ${x}\n`);t+=`Pilihan tindakan: ${"ABC"[c.e]}. ${k.opts[c.e].t}\nAlasan: ${c.ea}\nRisiko & mitigasi: ${c.er}\nSkor rubrik: ${R.E[i].map(a=>a.s).join("-")}\n\n`});
 t+="==== REFLEKSI ====\n"+RF.map((q,j)=>`${j+1}. ${q}\nJawab: ${S.rf[j].trim()||"-"}\n`).join("\n");return t}

/* ---------- Pengiriman hasil eksplorasi kasus ke Google Sheets ---------- */
function kirimEksplorasi(record){
 const url=(window.RBP_CONFIG&&window.RBP_CONFIG.DRIVE_WEB_APP_URL)||"";
 if(!url)return Promise.resolve(false);
 try{return fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(record)}).then(()=>true).catch(()=>false)}catch(e){return Promise.resolve(false)}
}
/* ---------- Modal & confetti ---------- */
function modal(h){$("#mbox").innerHTML=h;$("#modal").classList.add("show")}
function closeM(){$("#modal").classList.remove("show")}
function confetti(n){const cols=["#E52521","#FFD700","#43B047","#5C94FC","#fff","#E98B35"];for(let i=0;i<n;i++){const d=document.createElement("i");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];d.style.animationDuration=(2.4+Math.random()*2.6)+"s";d.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}}

/* ---------- Event ---------- */
const getP=(o,p)=>p.split(".").reduce((a,k)=>a[k],o);
function setP(o,p,v){const a=p.split(".");const l=a.pop();a.reduce((x,k)=>x[k],o)[l]=v}
function upd(){const i=S.ci,s=$("#stat");if(s){s.className="stat "+(missing(i).length?"":"ok");s.textContent=statTxt(i)}const b=document.querySelector(".bar i"),l=document.querySelectorAll(".top .lbl");if(b){b.style.width=doneN()/3*100+"%";l[1].textContent="KASUS SELESAI "+doneN()+" / 3"}}
const A=$("#app");
A.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.f){setP(S.c[S.ci],t.dataset.f,t.value);const cc=A.querySelector(`[data-c="${t.dataset.f}"]`);const n=wc(t.value);cc.textContent=`${n} kata (minimal ${MIN})`;cc.classList.toggle("ok",n>=MIN);save();upd()}
 else if(t.dataset.rf!==undefined){S.rf[+t.dataset.rf]=t.value;save()}
 else if(t.dataset.nm){S.nm=t.value;save()}});
A.addEventListener("change",e=>{const t=e.target,c=S.c[S.ci];
 if(t.dataset.fdo!==undefined){c.f[+t.dataset.fdo]=+t.value}
 else if(t.dataset.si!==undefined){const k=+t.dataset.si;c.si=t.checked?[...new Set([...c.si,k])]:c.si.filter(x=>x!==k);t.closest(".sl").classList.toggle("sel",t.checked)}
 else if(t.dataset.e!==undefined){c.e=+t.dataset.e;A.querySelectorAll(".dec").forEach(l=>l.classList.toggle("sel",l.contains(t)))}
 else return;save();upd()});
A.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
 if(a==="start"||a==="list"){S.view="list";save();draw()}
 else if(a==="open"){S.view="case";S.ci=+b.dataset.i;save();draw()}
 else if(a==="prev"){S.ci=Math.max(0,S.ci-1);save();draw()}
 else if(a==="next"){S.ci=Math.min(2,S.ci+1);save();draw()}
 else if(a==="finish"){const bad=[0,1,2].filter(i=>missing(i).length);
  if(bad.length){const w=$("#warn");const msg=`⚠️ Investigasi belum bisa diakhiri. Kasus yang belum lengkap: ${bad.map(i=>"Kasus "+(i+1)+" ("+missing(i).slice(0,3).join(", ")+(missing(i).length>3?", ...":"")+")").join("; ")}.`;if(w){w.innerHTML=msg;w.classList.add("show")}else alert(msg.replace(/<[^>]+>/g,""));return}
  modal(`<h3>Akhiri Investigasi?</h3><p style="font-weight:600">Semua bagian wajib pada ketiga kasus sudah terisi. Setelah diakhiri, hasil dan pembahasan akan ditampilkan. Apakah kamu yakin?</p><div class="row"><button class="btn y" data-m="no">BELUM, CEK LAGI</button><button class="btn g" data-m="yes">YA, AKHIRI</button></div>`)}
 else if(a==="reset"){modal(`<h3>Ulangi Investigasi?</h3><p style="font-weight:600">Semua jawaban, hasil, dan refleksimu akan dihapus dari perangkat ini. Apakah kamu yakin?</p><div class="row"><button class="btn y" data-m="no">BATAL</button><button class="btn" data-m="reset">YA, HAPUS & ULANGI</button></div>`)}
 else if(a==="saverf"){
  const rec={type:"eksplorasi_kasus_refleksi",studentName:S.nm||"",date:new Date().toISOString(),reflectionQuestions:RF,reflectionAnswers:S.rf||[],caseTitle:(S.ci!=null&&C[S.ci]?C[S.ci].title:"Eksplorasi Kasus Pancasila"),investigation:S.c||[],score:resultData().pct||0};
  try{const old=JSON.parse(localStorage.getItem("rbp_kasus_refleksi_backup")||"[]");old.push(rec);localStorage.setItem("rbp_kasus_refleksi_backup",JSON.stringify(old))}catch(x){}
  S.rfSaved=true;save();const msg=$("#rfmsg");if(msg){msg.textContent="Refleksi tersimpan sebagai cadangan di perangkat dan permintaan pengiriman telah dikirim ke Google Sheets. Periksa tab Hasil Eksplorasi Kasus dan Refleksi.";msg.classList.remove("hidden")}kirimEksplorasi(rec);confetti(30)
 }
 else if(a==="dl"){const bl=new Blob([txt()],{type:"text/plain;charset=utf-8"});const l=document.createElement("a");l.href=URL.createObjectURL(bl);l.download="hasil-misi-investigasi-pancasila.txt";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),1000)}
 else if(a==="print")casePrint()});
$("#mbox").addEventListener("click",e=>{const m=e.target.dataset.m;if(!m)return;closeM();
 if(m==="yes"){
  S.done=true;S.view="result";S.fresh=true;save();draw();
  const rd=resultData();const rec={type:"eksplorasi_kasus",studentName:S.nm||"",date:new Date().toISOString(),score:rd.pct,totalScore:rd.total,predicate:rd.g||"",cases:S.c||[],reflections:S.rf||[],fullResult:rd};
  try{const old=JSON.parse(localStorage.getItem("rbp_eksplorasi_backup")||"[]");old.push(rec);localStorage.setItem("rbp_eksplorasi_backup",JSON.stringify(old))}catch(x){}
  kirimEksplorasi(rec);
 }
 else if(m==="reset"){S=blank();try{localStorage.removeItem(KEY)}catch(x){}draw()}});
draw();

}});

<script>

RBP.define("kuis",{init:function(root,document){

/* ---------- PENGATURAN GAMBAR MASKOT ----------

/* ---------- Karakter pixel bawaan (fallback) ---------- */
function px(m,c,s){let r="";m.forEach((l,y)=>[...l].forEach((ch,x)=>{if(c[ch])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c[ch]}"/>`}));return `<svg viewBox="0 0 ${m[0].length} ${m.length}" style="width:${m[0].length*s}px;height:${m.length*s}px" role="img" aria-label="maskot">${r}</svg>`}
const HERO=["..o....o..",".ooo..ooo.",".oooooooo.","oooooooooo","oookookooo","ooowwwwooo","ooowppwooo",".ooowwwoo.","..oooooo..",".ooowwwoo.",".oo....oo.","oo......oo"];
const heroSvg=px(HERO,{o:"#FFA928",w:"#FFF5DC",p:"#FF8598",k:"#3B281E"},9);
function mascot(url,fallback){
  if(!url)return fallback;
  const safe=fallback.replace(/"/g,"&quot;");

}
const $mascotIntro=()=>mascot(IMG.mario,heroSvg)+mascot(IMG.mushroom,'<span class="em">🍄</span>')+mascot(IMG.princess,'<span class="em">⭐</span>');

/* ---------- Ilustrasi SVG tebak gambar (buatan sendiri) ---------- */
function person(x,y,sh,sk,o){o=o||{};

  else if(o.up)s+=arm(`M${x-11} ${y+16}L${x-14} ${y+34}`)+arm(`M${x+10} ${y+16}L${x+19} ${y+2}L${x+8} ${y-8}`);

  else s+=arm(`M${x-11} ${y+16}L${x-14} ${y+34}`)+arm(`M${x+11} ${y+16}L${x+14} ${y+34}`);

  if(o.hj)s+=`<circle cx="${x}" cy="${y}" r="14" fill="${o.hj}" stroke="#4a3a35" stroke-width="1.5"/><circle cx="${x}" cy="${y+1}" r="9" fill="${sk}"/>`;

}
const SK=["#f6cba5","#d9a066","#a8683f"];

    s+=`<rect x="74" y="14" width="190" height="52" rx="3" fill="#4f8f6a" stroke="#6b4f45" stroke-width="4"/><path d="M90 30h70M90 44h110M205 30h40" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>`;

    s+=person(260,86,"#7cc47f",SK[1],{});
    s+=`<rect x="248" y="112" width="26" height="9" fill="#ffd700" stroke="#4a3a35"/><rect x="250" y="103" width="22" height="9" fill="#e45b5b" stroke="#4a3a35"/>`;
    s+=`<text x="160" y="40" font-size="30" text-anchor="middle">💛</text>`;
    return W(s,"Seorang siswa menolong temannya yang terjatuh dan bukunya berserakan, tanpa membeda-bedakan","#bfe4f5");

/* ---------- BANK SOAL (20 soal, level kognitif C3–C6) ---------- */
const SILA=["Ketuhanan Yang Maha Esa","Kemanusiaan yang Adil dan Beradab","Persatuan Indonesia","Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan","Keadilan Sosial bagi Seluruh Rakyat Indonesia"];
const SILA_S=["Ketuhanan","Kemanusiaan","Persatuan","Kerakyatan","Keadilan Sosial"];
const IMGQ="Sila Pancasila manakah yang paling tercermin pada situasi dalam gambar ini?";
const Q=[
/* BAGIAN I - PILIHAN GANDA BERSTIMULUS (C3–C6) */
{t:"mc",sec:"I",tag:"PILIHAN GANDA • C4 • SEDANG",story:"Rancangan peraturan penataan pasar di sebuah kota menggusur pedagang kecil tanpa ganti rugi demi masuknya investor. Penyusunnya beralasan, “Pembangunan itu urusan duniawi, jadi tidak ada kaitannya dengan nilai ketuhanan.”",q:"Pernyataan penyusun rancangan tersebut paling tepat dinilai sebagai ...",o:["tepat, karena sila pertama hanya mengatur hubungan pribadi manusia dengan Tuhan sehingga kebijakan ekonomi cukup berpijak pada sila kelima","tepat, karena setiap sila berdiri sendiri sehingga setiap kebijakan hanya perlu merujuk pada satu sila yang paling relevan","keliru, karena nilai ketuhanan menjiwai sila-sila lainnya sehingga kebijakan pembangunan tetap harus menjunjung kemanusiaan dan keadilan","keliru, karena sila pertama menuntut setiap kebijakan ekonomi diputuskan lebih dahulu oleh lembaga keagamaan"],c:2,
k:"Hubungan antarsila: Ketuhanan Yang Maha Esa meliputi dan menjiwai sila kedua sampai kelima.",
e:"Pancasila adalah kesatuan yang saling menjiwai. Karena nilai ketuhanan menjiwai sila lainnya, kebijakan pembangunan tidak boleh lepas dari kemanusiaan (martabat pedagang kecil) dan keadilan (ganti rugi, perlakuan layak). Alasan penyusun keliru karena memisahkan ekonomi dari nilai moral.",
w:["Sila pertama tidak terbatas pada ibadah pribadi; nilainya menjiwai penyelenggaraan negara.","Sila-sila Pancasila merupakan satu kesatuan, bukan pilihan satu sila sesuai kepentingan.","","Menjiwai nilai tidak sama dengan menyerahkan keputusan kebijakan kepada lembaga keagamaan."],
p:"Kebijakan publik dinilai dengan seluruh sila secara utuh, bukan dengan satu sila yang dipilih sesuai kepentingan."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C4 • SEDANG",story:"Seorang guru membagikan dana bantuan sekolah sebesar Rp500.000 untuk setiap siswa di kelasnya, termasuk siswa dari keluarga mampu. Siswa yang orang tuanya baru kehilangan pekerjaan mengeluh bantuan itu tidak cukup untuk membayar SPP. Guru menjawab, “Saya sudah adil, semua mendapat jumlah yang sama.”",q:"Kekeliruan guru dalam memahami makna adil yang paling tepat adalah ...",o:["menyamakan adil dengan sama rata tanpa mempertimbangkan kebutuhan dan ukuran objektif yang relevan","menganggap adil bergantung pada keinginan pihak yang berwenang, bukan pada aturan yang berlaku umum","menganggap pemberian bantuan bukan tugas guru sehingga seharusnya diserahkan kepada pihak lain","menganggap adil harus selalu memberi bagian lebih besar kepada siswa dengan prestasi akademik terbaik"],c:0,
k:"Makna “adil” dalam sila kedua dan kelima: keputusan didasari ukuran/norma objektif, tidak sewenang-wenang.",
e:"Adil bukan berarti selalu sama jumlahnya. Guru memakai ukuran “sama rata”, padahal kebutuhan siswa berbeda. Ukuran objektif yang relevan di sini adalah tingkat kebutuhan, sehingga siswa yang terdampak PHK seharusnya mendapat perhatian lebih besar.",
w:["","Guru tidak memutuskan atas dasar kehendak atasan; ia justru memakai aturan sama rata yang kaku.","Kasus tidak mempersoalkan wewenang guru, tetapi cara menentukan ukuran pembagian.","Prestasi bukan ukuran objektif yang relevan untuk bantuan yang dimaksudkan menutup kebutuhan."],
p:"Keadilan menuntut pertimbangan kebutuhan dan norma objektif; perlakuan yang sama persis belum tentu adil."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C5 • SULIT",story:"Sebuah sekolah mewajibkan semua siswa memakai batik pada Hari Persatuan dan melarang busana daerah lain. Kepala sekolah beralasan, “Jika semua tampak sama, tidak ada perbedaan, sehingga tidak ada konflik.” Beberapa siswa dari berbagai daerah merasa identitasnya tidak dihargai.",q:"Evaluasi yang paling tepat terhadap kebijakan tersebut berdasarkan sila Persatuan Indonesia adalah ...",o:["tepat, karena persatuan hanya dapat dicapai apabila seluruh perbedaan dihilangkan dari ruang publik sekolah","tepat sebagian, karena kepentingan kelompok terbesar perlu didahulukan agar persatuan tetap terjaga","keliru, karena persatuan hanya menyangkut sikap hormat pada bendera dan lagu kebangsaan, bukan busana siswa","keliru, karena persatuan menjadikan keberagaman sebagai modal bersama, bukan untuk diseragamkan"],c:3,
k:"Persatuan dalam keberagaman (Bhinneka Tunggal Ika): perbedaan sebagai modal persatuan.",
e:"Sila ketiga tidak menghapus perbedaan, tetapi merajutnya dalam kesepakatan bersama. Menyeragamkan berarti mengubah persatuan menjadi keseragaman. Cara yang lebih tepat: menampilkan semua busana daerah sebagai kekayaan bersama.",
w:["Persatuan Indonesia tidak menuntut hilangnya perbedaan.","Persatuan tidak berarti kepentingan mayoritas selalu mengalahkan identitas kelompok lain.","Persatuan tidak dibatasi pada simbol kenegaraan; sikap menghargai keberagaman juga termasuk.",""],
p:"Persatuan dibangun dengan menghargai perbedaan, bukan dengan menghapusnya."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C4 • SEDANG",story:"Dalam proyek kelompok lintas kelas, Salsa berkata, “Aku tidak akan membagikan hasil risetku ke kelompok lain. Kelompok kami harus juara, dan bersaing itu hakku.”",q:"Sikap Salsa paling bertentangan dengan Pancasila sebagai pandangan hidup bangsa karena ...",o:["Pancasila menolak setiap bentuk persaingan, bahkan persaingan yang berlangsung secara sehat dan sportif","mengutamakan keunggulan kelompok sendiri di atas semangat kekeluargaan dan kebersamaan","Pancasila tidak mengakui adanya hak pribadi sama sekali dalam kehidupan bersama masyarakat","kelompok lintas kelas tidak diperbolehkan memiliki target prestasi dalam kegiatan belajar"],c:1,
k:"Pancasila sebagai pandangan hidup (Weltanschauung): kekeluargaan dan kebersamaan (kolektiviteit), menolak individualisme.",
e:"Masalahnya bukan persaingan atau hak pribadi, melainkan cara bersaing yang menutup kerja sama dan solidaritas. Pandangan hidup Pancasila menempatkan kebersamaan sebagai asas, sehingga bersaing tetap boleh selama tidak mengorbankan kekeluargaan.",
w:["Persaingan sehat tidak dilarang; yang bermasalah adalah sikap menutup diri.","","Pancasila mengakui hak pribadi, tetapi disertai tanggung jawab sosial.","Memiliki target prestasi tidak bertentangan dengan Pancasila."],
p:"Pancasila tidak anti persaingan, tetapi menolak individualisme yang meniadakan kebersamaan."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C4 • SULIT",story:"Pemerintah daerah menerbitkan peraturan yang memperketat izin toko jaringan besar agar usaha kecil lokal terlindungi. Seorang siswa berkata, “Peraturan ini adalah nilai dasar Pancasila karena isinya tentang keadilan sosial.”",q:"Tanggapan yang paling tepat terhadap pernyataan siswa tersebut adalah ...",o:["Benar, karena setiap aturan yang memuat tujuan keadilan otomatis menjadi nilai dasar Pancasila","Kurang tepat, karena peraturan itu termasuk nilai praksis sebab langsung mengatur kegiatan usaha warga","Kurang tepat, karena nilai Pancasila hanya terdapat dalam UUD 1945 dan tidak dalam peraturan daerah","Kurang tepat, karena itu nilai instrumental: penjabaran sila kelima yang dinamis dan dapat direvisi"],c:3,
k:"Nilai dasar, nilai instrumental, dan nilai praksis Pancasila.",
e:"Nilai dasar bersifat tetap dan abstrak (hakikat kelima sila). Peraturan daerah adalah penjabaran nilai dasar ke dalam aturan hukum, yaitu nilai instrumental, yang dapat berubah menyesuaikan kebutuhan selama tidak bertentangan dengan nilai dasar. Nilai praksis adalah pelaksanaan nyata dalam perilaku.",
w:["Memuat kata atau tujuan keadilan tidak menjadikan sebuah aturan sebagai nilai dasar.","Peraturan tertulis termasuk instrumental; praksis adalah pelaksanaan nyata dalam perilaku.","Nilai instrumental justru mencakup UUD 1945, undang-undang, hingga peraturan di bawahnya.",""],
p:"Nilai dasar tetap; peraturan adalah penjabarannya yang boleh disesuaikan zaman; praksis adalah wujud nyata di lapangan."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C5 • SULIT",story:"Dalam debat kelas, Rafi berpendapat bahwa Pancasila hanyalah ideologi yang dipaksakan penguasa untuk menyeragamkan pikiran rakyat atau “kesadaran palsu”. Zaki ingin membantahnya dengan menggunakan pandangan Prof. Jimly Asshiddiqie tentang ideologi.",q:"Argumen Zaki yang paling kuat adalah ...",o:["Pancasila digali dari nilai religius, budaya, dan adat istiadat bangsa sendiri, bukan rekayasa satu kelompok","Pancasila dirumuskan oleh tokoh-tokoh besar bangsa sehingga kebenarannya tidak perlu diuji atau dikritik kembali oleh generasi berikutnya","Setiap ideologi pasti benar dan tidak mengandung kepentingan kelompok selama sudah dipakai sebagai dasar negara","Pancasila adalah ilmu pengetahuan murni yang dibuktikan secara ilmiah sehingga tidak berkaitan dengan keyakinan maupun nilai budaya"],c:0,
k:"Pancasila sebagai ideologi dalam arti netral (Jimly Asshiddiqie).",
e:"Rafi memandang ideologi sebagai alat kekuasaan. Dalam arti netral, ideologi adalah keseluruhan sistem berpikir, sikap, dan nilai dasar kebudayaan bangsa. Karena Pancasila digali dari kehidupan bangsa sendiri, ia bukan hasil rekayasa satu kelompok.",
w:["","Keabsahan Pancasila tidak bertumpu pada kebesaran pembuatnya; Pancasila justru terbuka untuk dipahami kritis.","Klaim bahwa ideologi pasti benar tidak menjawab tuduhan Rafi dan tidak dapat dipertanggungjawabkan.","Pancasila memuat nilai dan keyakinan, bukan ilmu murni."],
p:"Menjawab kritik berarti memakai konsep yang tepat, bukan sekadar membela dengan klaim otoritas."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C3 • SEDANG",story:"Setelah pembahasan di DPR dan masukan dari berbagai kelompok masyarakat, pemerintah merevisi aturan perlindungan data pribadi untuk menjawab perkembangan kecerdasan buatan. Revisi itu tidak mengubah prinsip kemanusiaan dan keadilan yang menjadi landasannya.",q:"Dimensi Pancasila sebagai ideologi terbuka (Alfian) yang paling tampak dalam peristiwa ini adalah ...",o:["realita: nilai bersumber dari kenyataan hidup masyarakat Indonesia sendiri","idealisme: terkandung cita-cita luhur yang ingin dicapai bangsa","fleksibilitas: terbuka bagi pemikiran baru secara demokratis","dogmatis: aturan tidak boleh disesuaikan dengan keadaan baru apa pun"],c:2,
k:"Dimensi ideologi terbuka menurut Alfian: idealisme, realita, dan fleksibilitas.",
e:"Penyesuaian aturan terhadap perkembangan teknologi melalui pembahasan demokratis, tanpa mengubah nilai dasar, adalah wujud fleksibilitas. Realita berkaitan dengan sumber nilai dari kehidupan masyarakat, sedangkan idealisme berkaitan dengan cita-cita luhur.",
w:["Realita menjelaskan asal nilai dari kehidupan masyarakat, bukan proses penyesuaian terhadap pemikiran baru.","Idealisme menyangkut cita-cita luhur, bukan penyesuaian aturan terhadap perkembangan zaman.","","Sikap dogmatis adalah ciri ideologi tertutup, bukan dimensi ideologi terbuka."],
p:"Ideologi terbuka berkembang pada tataran penjabaran dan tetap menjaga nilai dasarnya."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C5 • SULIT",story:"Dalam forum pelajar internasional, delegasi Indonesia menyatakan Pancasila layak ditawarkan sebagai landasan hidup bersama karena mengakui hak individu sekaligus kepentingan sosial. Seorang delegasi lain menanggapi, “Itu hanya kompromi tanpa prinsip.”",q:"Jawaban paling tepat untuk menanggapi kritik tersebut adalah ...",o:["Pancasila sengaja dibuat netral tanpa nilai yang mengikat, sehingga cocok dipakai semua bangsa tanpa perlu disesuaikan","Pancasila moderat karena berprinsip, bukan kompromi: lima sila menyeimbangkan kepentingan individu dan masyarakat","Pancasila adalah gabungan separuh liberalisme dan separuh sosialisme yang dicampur secara praktis agar semua pihak puas","Pancasila unggul karena menolak berhubungan dengan ideologi lain sehingga terjaga kemurniannya dari pengaruh luar"],c:1,
k:"Pancasila sebagai ideologi moderat yang tidak condong ke liberalisme-kapitalisme maupun sosialisme-komunisme.",
e:"Moderat bukan berarti tanpa prinsip atau sekadar campuran. Pancasila punya nilai dasar sendiri yang digali dari bangsa Indonesia dan menyeimbangkan individu dan masyarakat. Karena itu ia dapat menjadi ideologi alternatif bagi perdamaian dunia.",
w:["Pancasila memiliki nilai dasar yang mengikat, bukan netral tanpa nilai.","","Pancasila bukan hasil mencampur dua ideologi lain, tetapi sistem nilai yang bersumber dari bangsa sendiri.","Pancasila bersifat terbuka, bukan menutup diri; menolak hubungan bukan ciri ideologi moderat."],
p:"Moderat berarti seimbang berdasarkan nilai sendiri yang jelas, bukan kompromi tanpa pegangan."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C3 • SEDANG",story:"Pemerintah daerah memberlakukan aturan wajib menyediakan jalur dan rambu ramah disabilitas di fasilitas umum. Di sekolah, Bima rutin menemani temannya yang menggunakan kursi roda menuju kantin dan perpustakaan.",q:"Klasifikasi yang tepat untuk kedua tindakan tersebut adalah ...",o:["keduanya implementasi objektif karena sama-sama untuk penyandang disabilitas","aturan pemerintah daerah implementasi subjektif, sikap Bima implementasi objektif","keduanya implementasi subjektif karena sama-sama dilakukan manusia","aturan pemerintah daerah implementasi objektif, sikap Bima implementasi subjektif"],c:3,
k:"Implementasi objektif (penyelenggaraan negara dan peraturan) dan subjektif (perilaku individu).",
e:"Implementasi objektif terkait penyelenggaraan negara dan peraturan perundang-undangan, yaitu aturan daerah. Implementasi subjektif adalah pelaksanaan nilai Pancasila oleh individu, yaitu sikap Bima.",
w:["Pembedaan didasarkan pada pelaku dan wujudnya, bukan pada siapa penerima manfaatnya.","Posisi dua jenis implementasi tertukar: aturan negara bersifat objektif, sikap pribadi bersifat subjektif.","Aturan pemerintah berada pada ranah penyelenggaraan negara, sehingga bersifat objektif.",""],
p:"Pancasila perlu diamalkan di dua ranah: kebijakan negara dan perilaku pribadi warganya."},

{t:"mc",sec:"I",tag:"PILIHAN GANDA • C6 • SULIT",story:"Di sebuah SMA muncul tren memamerkan barang mewah di media sosial. Siswa dari keluarga kurang mampu mulai merasa minder, dan beberapa memaksa orang tua membeli barang serupa dengan berutang.",q:"Rancangan program OSIS yang paling tepat dan berimbang untuk mengatasi persoalan ini adalah ...",o:["melarang seluruh siswa membawa gawai dan menggunakan media sosial selama berada di lingkungan sekolah","memberi sanksi hanya kepada siswa yang sering memamerkan barang mewah di media sosial agar jera","kampanye hidup sederhana melibatkan semua siswa, disertai bazar murah, kegiatan berbagi, dan literasi keuangan","membiarkan tren berlangsung karena pilihan gaya hidup adalah urusan pribadi masing-masing keluarga"],c:2,
k:"Tantangan sila Keadilan Sosial (hedonisme, individualisme) dan upaya menjawabnya.",
e:"Program yang tepat menyentuh sebab persoalan (budaya pamer dan tekanan sosial), melibatkan semua pihak, dan membangun kebiasaan baru, sehingga mencerminkan keadilan sosial, kemanusiaan, dan kebersamaan.",
w:["Pelarangan total berlebihan dan tidak menyentuh akar persoalan; media sosial tetap dapat dipakai secara beretika.","Sanksi yang menyasar satu kelompok tidak menumbuhkan kesadaran dan berpotensi tidak adil.","","Membiarkan berarti mengabaikan dampak sosial dan ekonomi yang dialami siswa lain."],
p:"Solusi yang baik memadukan edukasi, keteladanan, dan keterlibatan semua pihak."},

/* BAGIAN II - ANALISIS GAMBAR */
{t:"img",sc:1,sec:"II",tag:"ANALISIS GAMBAR • C5 • SEDANG",story:"Di sebuah SMA negeri yang siswanya beragam agama, guru membuka pelajaran dengan mempersilakan siswa berdoa menurut keyakinan masing-masing. Sebagian orang tua mengusulkan kegiatan ini ditiadakan agar sekolah “netral”.",q:"Penilaian yang paling tepat terhadap kegiatan pada gambar dan usulan tersebut adalah ...",o:["kegiatan tepat jika doa dipimpin pemeluk agama mayoritas agar tertib, sedangkan siswa lain cukup mengikuti dengan hormat","usulan tepat karena netralitas sekolah berarti menyingkirkan seluruh unsur keagamaan dari kegiatan belajar mengajar","kegiatan tepat karena memberi ruang setiap siswa menjalankan keyakinannya; meniadakannya mengabaikan nilai ketuhanan","kegiatan kurang tepat karena sila pertama hanya berlaku di tempat ibadah, bukan di lingkungan sekolah negeri"],c:2,
k:"Sila Ketuhanan Yang Maha Esa: kebebasan beribadah menurut keyakinan masing-masing dan sikap saling menghormati.",
e:"Doa menurut keyakinan masing-masing menunjukkan penghormatan atas kebebasan beragama tanpa memaksa. Meniadakannya demi “netral” mengabaikan nilai ketuhanan yang menjiwai kehidupan bersama, sedangkan negara Pancasila menjamin kebebasan beribadah bagi semua pemeluk agama.",
w:["Doa yang dipimpin mayoritas memaksa pihak lain mengikuti cara yang tidak sesuai keyakinannya.","Pancasila tidak menyingkirkan peran agama dari kehidupan bersama; yang dijamin adalah kebebasan setiap pemeluk.","","Nilai ketuhanan berlaku di seluruh ruang kehidupan, termasuk sekolah."],
p:"Menghormati keberagaman keyakinan berarti memberi ruang, bukan menyeragamkan dan bukan meniadakan."},
