<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5C94FC">
<title>Ruang Belajar Pancasila - Kelas XI SMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== CANGKANG APLIKASI (RBP) ===== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#5C94FC 0%,#A8D8FF 55%,#EAF7FF 100%);background-attachment:fixed;font-family:'Plus Jakarta Sans',sans-serif;color:#243B64}
#rbp-stage{position:relative;width:100%;min-height:100vh;overflow-x:clip}
.rbp-view{display:none}
.rbp-view.on{display:block}
.rbp-view:focus{outline:none}
.rbp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rbp-boot{padding:40px 16px;text-align:center;font:700 .8rem 'Press Start 2P',monospace;color:#fff;text-shadow:2px 2px 0 #222}

/* ===== MASKOT OYEN GLOBAL + PANDUAN PER HALAMAN ===== */
.rbp-mario{position:fixed;left:16px;bottom:18px;z-index:9999;pointer-events:auto;line-height:0;cursor:pointer;touch-action:manipulation}
.rbp-mario>img,.rbp-mario>svg{display:block;height:104px;width:auto;shape-rendering:crispEdges;image-rendering:pixelated;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.16))}.rbp-mario>canvas{display:block;width:200px;height:179px;image-rendering:pixelated;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.18));transform:scaleX(-1);transform-origin:50% 100%}
.rbp-mario:focus-visible{outline:3px solid #FFD700;outline-offset:5px;border-radius:8px}
.rbp-mario-bubble{position:absolute;left:0;bottom:calc(100% + 14px);width:max-content;max-width:min(340px,82vw);padding:12px 15px;border:3px solid #222;border-radius:12px;background:#FFF8E7;color:#243B64;font:700 .78rem/1.5 'Plus Jakarta Sans',sans-serif;box-shadow:4px 4px 0 #222;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s;white-space:normal}
.rbp-mario-bubble.show{opacity:1;transform:translateY(0)}
.rbp-mario-burst{position:absolute;left:50%;bottom:55%;width:1px;height:1px;pointer-events:none}
.rbp-mario-particle{position:absolute;font-size:18px;line-height:1;animation:rbpMarioParticle .9s ease-out forwards}
@keyframes rbpMarioParticle{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.2)}}
@keyframes rbpOyenPop{0%{transform:scaleX(-1) scale(1) translateY(0)}28%{transform:scaleX(-1) scale(1.12,.9) translateY(2px)}58%{transform:scaleX(-1) scale(.94,1.12) translateY(-12px)}78%{transform:scaleX(-1) scale(1.04,.98) translateY(0)}100%{transform:scaleX(-1) scale(1) translateY(0)}}
.rbp-mario.pop>canvas{animation:rbpOyenPop .62s cubic-bezier(.2,.8,.3,1)}
@keyframes rbpHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:700px){.rbp-mario{left:8px;bottom:12px}.rbp-mario>img,.rbp-mario>svg{height:92px}.rbp-mario>canvas{width:150px;height:134px}.rbp-mario-bubble{max-width:min(290px,82vw);font-size:.74rem}}
@media(max-height:480px){.rbp-mario{display:none}}
@media(prefers-reduced-motion:reduce){.rbp-mario>img,.rbp-mario>svg{animation:none}}
@media print{.rbp-mario{display:none!important}}

</style>
</head>
<body>
<div id="rbp-live" class="rbp-sr" aria-live="polite"></div>
<div id="rbp-stage"><div class="rbp-boot">Memuat Ruang Belajar Pancasila...</div></div>

<!-- ===== CSS tiap bagian (asli, dipakai di dalam Shadow DOM masing-masing) ===== -->
<script type="text/plain" id="css-flow">/* ===== NAVIGASI KEMBALI / SELANJUTNYA (dipakai semua bagian) ===== */
.rbp-flow{position:relative;z-index:3;max-width:980px;margin:10px auto 0;padding:18px 16px 160px;font-family:'Plus Jakarta Sans',sans-serif}
.rbp-flow-in{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;justify-content:space-between;padding:16px;border:4px solid #222;border-radius:16px;background:#FFF8E7;box-shadow:6px 6px 0 #222}
.rbp-flow-pos{flex:1 1 100%;text-align:center;font:400 .55rem/1.8 'Press Start 2P',monospace;color:#243B64}
.rbp-fb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:10px 16px;border:3px solid #222;border-radius:10px;box-shadow:4px 4px 0 #222;font:400 .6rem/1.7 'Press Start 2P',monospace;color:#fff;background:#E52521;text-decoration:none;cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s;flex:1 1 150px}
.rbp-fb small{font:700 .72rem/1.3 'Plus Jakarta Sans',sans-serif;opacity:.95;letter-spacing:0}
.rbp-fb:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #222}
.rbp-fb.y{background:#FFD700;color:#222}
.rbp-fb.g{background:#008C45}
.rbp-fb.home{background:#6D28D9;color:#fff}
.rbp-fb.material{background:#087E8B;color:#fff}
.rbp-fb.done{background:#008C45;color:#fff}
.rbp-fb.solo{flex:0 1 auto}
.rbp-fb:focus-visible{outline:4px solid #FFD700;outline-offset:3px}
.rbp-fb[hidden]{display:none}
@media(max-width:560px){.rbp-fb{flex:1 1 100%}}
@media print{.rbp-flow{display:none!important}}
</script>
<script type="text/plain" id="css-beranda">
:host{
 --sky:#5C94FC;
 --sky-light:#B9E2FF;
 --cream:#FFF8E7;
 --red:#E52521;
 --green:#43B047;
 --navy:#243B64;
 --yellow:#FFD700;
 --ink:#252525;
 --body:'Plus Jakarta Sans',sans-serif;
 --pixel:'Press Start 2P',cursive;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:host{
 width:100%;
 min-height:100%;
 font-family:var(--body);
 color:var(--navy);
 overflow-x:clip;
}

:host{
 background:linear-gradient(
  180deg,
  #5C94FC 0%,
  #A8D8FF 55%,
  #EAF7FF 100%
 );
}

/* AREA BERANDA */
.hero-viewport{
 position:relative;
 isolation:isolate;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:76px 24px 90px;
 overflow:hidden;
}

.hero-stage{
 position:relative;
 z-index:2;
 width:min(100%,1040px);
 margin:auto;
 isolation:isolate;
}

/* PANEL UTAMA */
.hero-panel{
 position:relative;
 z-index:2;
 width:100%;
 padding:clamp(34px,5vw,66px) clamp(22px,5vw,62px) 34px;
 border:5px solid var(--ink);
 border-radius:24px;
 background:var(--cream);
 box-shadow:
  10px 10px 0 var(--ink),
  0 22px 55px rgba(36,59,100,.2);
 text-align:center;
}

.hero-panel:before{
 content:"";
 position:absolute;
 inset:10px;
 border:2px dashed rgba(36,59,100,.18);
 border-radius:14px;
 pointer-events:none;
}

/* =================================
   AWAN KECIL BERGERAK DI DEPAN
================================= */

.cloud-layer{
 position:absolute;
 inset:0;
 z-index:10;
 overflow:hidden;
 pointer-events:none;
}

.cloud{
 position:absolute;
 left:0;
 width:46px;
 height:14px;
 background:rgba(255,255,255,.92);
 border-radius:30px;
 filter:drop-shadow(0 2px 2px rgba(54,112,190,.16));
 animation:cloudDrift linear infinite;
}

.cloud::before,
.cloud::after{
 content:"";
 position:absolute;
 background:inherit;
 border-radius:50%;
}

.cloud::before{
 width:21px;
 height:21px;
 top:-10px;
 left:7px;
}

.cloud::after{
 width:27px;
 height:27px;
 top:-14px;
 right:5px;
}

/* Posisi, ukuran, dan kecepatan awan */
.cloud-1{
 top:9%;
 opacity:.9;
 animation-duration:32s;
 animation-delay:-9s;
}

.cloud-2{
 top:25%;
 transform:scale(.78);
 opacity:.76;
 animation-duration:41s;
 animation-delay:-25s;
}

.cloud-3{
 top:43%;
 transform:scale(.68);
 opacity:.82;
 animation-duration:36s;
 animation-delay:-17s;
}

.cloud-4{
 top:63%;
 transform:scale(.85);
 opacity:.72;
 animation-duration:46s;
 animation-delay:-31s;
}

.cloud-5{
 top:80%;
 transform:scale(.72);
 opacity:.84;
 animation-duration:39s;
 animation-delay:-12s;
}

.cloud-6{
 top:92%;
 transform:scale(.62);
 opacity:.7;
 animation-duration:49s;
 animation-delay:-37s;
}

/* Gerakan awan dari kiri ke kanan */
@keyframes cloudDrift{
 from{
  left:-100px;
 }
 to{
  left:calc(100% + 100px);
 }
}

/* =================================
   GARUDA PANCASILA PIXEL-ART
================================= */

.garuda-emblem{
 position:relative;
 z-index:1;
 display:flex;
 justify-content:center;
 align-items:center;
 width:fit-content;
 margin:2px auto 22px;
 padding:7px;
 background:#fff8d9;
 border:4px solid var(--ink);
 border-radius:9px;
 box-shadow:
  4px 4px 0 var(--yellow),
  6px 6px 0 var(--ink);
}

.garuda-emblem img{
 display:block;
 width:clamp(62px,8vw,88px);
 height:auto;
 image-rendering:pixelated;
 filter:drop-shadow(1px 2px 0 rgba(37,37,37,.18));
}

/* STIKER KOIN, JAMUR, DAN BINTANG */
.sticker{
 position:absolute;
 z-index:3;
 display:grid;
 place-items:center;
 pointer-events:none;
 filter:drop-shadow(3px 4px 0 rgba(37,37,37,.28));
 user-select:none;
}

.sticker-coin{
 font-size:clamp(2.5rem,5vw,4rem);
 top:-30px;
 left:8%;
 transform:rotate(-12deg);
}

.sticker-mushroom{
 font-size:clamp(2.8rem,5.5vw,4.4rem);
 right:5%;
 top:12%;
 transform:rotate(9deg);
}

.sticker-star{
 font-size:clamp(2.3rem,4.5vw,3.6rem);
 left:4%;
 bottom:13%;
 transform:rotate(12deg);
}

/* LABEL ATAS */
.top-label{
 display:inline-flex;
 align-items:center;
 gap:10px;
 padding:9px 16px;
 margin-bottom:24px;
 border:3px solid var(--ink);
 border-radius:8px;
 background:var(--yellow);
 color:var(--ink);
 font-family:var(--pixel);
 font-size:clamp(.48rem,1vw,.62rem);
 line-height:1.8;
 box-shadow:4px 4px 0 var(--ink);
 position:relative;
 z-index:1;
}

.label-dot{
 width:9px;
 height:9px;
 border-radius:50%;
 background:var(--green);
 border:2px solid var(--ink);
}

/* JUDUL */
.welcome-sub{
 font-size:clamp(.78rem,1.5vw,1rem);
 font-weight:800;
 letter-spacing:.22em;
 color:var(--red);
 margin-bottom:12px;
}

.hero-title{
 line-height:1.2;
 margin-bottom:18px;
 position:relative;
 z-index:1;
}

.title-script{
 display:block;
 font-family:var(--body);
 font-weight:800;
 font-size:clamp(2rem,5vw,3.4rem);
 color:var(--navy);
 letter-spacing:-.06em;
}

.title-modern{
 display:block;
 margin-top:7px;
 font-family:var(--pixel);
 font-size:clamp(1.5rem,4.8vw,3.2rem);
 line-height:1.5;
 color:var(--red);
 text-shadow:
  3px 3px 0 var(--yellow),
  5px 5px 0 var(--ink);
 overflow-wrap:anywhere;
}

/* DESKRIPSI */
.hero-description{
 max-width:700px;
 margin:0 auto 28px;
 color:#39465B;
 font-size:clamp(.92rem,1.5vw,1.05rem);
 font-weight:600;
 line-height:1.8;
 position:relative;
 z-index:1;
}

/* KARTU INFORMASI */
.info-cards-grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:14px;
 max-width:880px;
 margin:0 auto 30px;
 position:relative;
 z-index:1;
}

.info-card{
 padding:17px 13px;
 border:3px solid var(--ink);
 border-radius:12px;
 background:#fff;
 box-shadow:4px 4px 0 var(--ink);
 transition:transform .2s ease;
}

.info-card:hover{
 transform:translateY(-4px);
}

.info-card:nth-child(2){
 background:#EAF7FF;
}

.info-card:nth-child(3){
 background:#FFF1D0;
}

.info-label{
 display:block;
 margin-bottom:8px;
 color:var(--red);
 font-family:var(--pixel);
 font-size:.52rem;
 line-height:1.8;
}

.info-value{
 font-size:.9rem;
 font-weight:800;
 line-height:1.5;
 color:var(--navy);
}

/* TOMBOL */
.cta-group{
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 justify-content:center;
 gap:14px;
 margin-bottom:28px;
 position:relative;
 z-index:1;
}

.btn-primary,
.btn-secondary,
.btn-guide,
.btn-c1,
.btn-c2,
.btn-c3{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-height:52px;
 padding:13px 20px;
 border:3px solid var(--ink);
 border-radius:10px;
 box-shadow:4px 4px 0 var(--ink);
 font-family:var(--pixel);
 font-size:.58rem;
 line-height:1.8;
 text-align:center;
 text-decoration:none;
 cursor:pointer;
 transition:transform .16s ease,box-shadow .16s ease;
}

.btn-primary{
 background:var(--red);
 color:#fff;
}

.btn-secondary{
 background:var(--yellow);
 color:var(--ink);
}

.btn-guide{
 background:var(--green);
 color:#fff;
}

.btn-primary:hover,
.btn-secondary:hover,
.btn-guide:hover,
.btn-c1:hover,
.btn-c2:hover,
.btn-c3:hover{
 transform:translate(-2px,-2px);
 box-shadow:6px 6px 0 var(--ink);
}

/* FOOTER */
.author-footer{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
 padding-top:20px;
 border-top:2px dashed rgba(36,59,100,.25);
 font-size:.84rem;
 font-weight:600;
 color:#4b5668;
 position:relative;
 z-index:1;
}

.author-footer strong{
 color:var(--red);
}

/* =================================
   MODAL PETUNJUK PENGGUNAAN
================================= */

.guide-modal-backdrop{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(15,28,48,.78);
 backdrop-filter:blur(7px);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 opacity:0;
 visibility:hidden;
 transition:opacity .25s ease,visibility .25s ease;
}

.guide-modal-backdrop.active{
 opacity:1;
 visibility:visible;
}

.guide-modal-box{
 width:100%;
 max-width:780px;
 max-height:88vh;
 overflow-y:auto;
 padding:clamp(20px,3.5vw,34px);
 border:4px solid var(--ink);
 border-radius:18px;
 background:var(--cream);
 box-shadow:8px 8px 0 var(--yellow);
 color:var(--navy);
 transform:translateY(14px);
 transition:transform .25s ease;
}

.guide-modal-backdrop.active .guide-modal-box{
 transform:translateY(0);
}

.guide-modal-box::-webkit-scrollbar{
 width:7px;
}

.guide-modal-box::-webkit-scrollbar-thumb{
 background:var(--green);
 border-radius:10px;
}

.guide-header{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:16px;
 padding-bottom:16px;
 margin-bottom:18px;
 border-bottom:3px dashed rgba(36,59,100,.25);
}

.guide-title{
 font-family:var(--pixel);
 font-size:clamp(.72rem,2vw,1rem);
 line-height:1.8;
 color:var(--red);
}

.guide-intro{
 font-size:.88rem;
 line-height:1.7;
 margin-top:8px;
 color:#3f4d62;
}

.guide-close-btn{
 width:38px;
 height:38px;
 flex-shrink:0;
 border:2px solid var(--ink);
 border-radius:8px;
 background:var(--yellow);
 color:var(--ink);
 font-size:1.35rem;
 font-weight:800;
 cursor:pointer;
}

.guide-steps{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
 margin-bottom:18px;
}

.guide-step-item{
 display:flex;
 gap:11px;
 padding:13px;
 border:2px solid var(--ink);
 border-radius:10px;
 background:#fff;
 box-shadow:3px 3px 0 rgba(37,37,37,.9);
}

.guide-step-item.full-span{
 grid-column:1/-1;
}

.step-num{
 width:28px;
 height:28px;
 display:grid;
 place-items:center;
 flex-shrink:0;
 border:2px solid var(--ink);
 border-radius:7px;
 background:var(--yellow);
 font-weight:900;
 color:var(--ink);
}

.step-content h4{
 font-size:.88rem;
 color:var(--red);
 margin-bottom:4px;
}

.step-content p{
 font-size:.8rem;
 line-height:1.55;
 color:#39465B;
}

.guide-notice{
 padding:15px;
 border:2px solid var(--ink);
 border-radius:10px;
 background:#EAF7FF;
 margin-bottom:16px;
}

.guide-notice h4{
 font-size:.85rem;
 color:var(--navy);
 margin-bottom:8px;
}

.guide-notice ul{
 padding-left:19px;
 display:grid;
 gap:5px;
}

.guide-notice li{
 font-size:.82rem;
 line-height:1.5;
 color:#39465B;
}

.guide-closing{
 text-align:center;
 font-size:.85rem;
 line-height:1.6;
 color:#39465B;
}

.guide-closing strong{
 display:block;
 color:var(--red);
 margin-top:5px;
}

/* RESPONSIVE */
@media(max-width:680px){

 .hero-viewport{
  padding:58px 16px 70px;
  min-height:100svh;
 }

 .hero-panel{
  padding:42px 20px 25px;
  border-width:4px;
  box-shadow:6px 6px 0 var(--ink);
 }

 .top-label{
  font-size:.42rem;
  padding:7px 10px;
  margin-bottom:18px;
 }

 .welcome-sub{
  letter-spacing:.12em;
 }

 .title-script{
  font-size:2.2rem;
 }

 .title-modern{
  font-size:1.45rem;
  text-shadow:
   2px 2px 0 var(--yellow),
   3px 3px 0 var(--ink);
 }

 .hero-description{
  font-size:.88rem;
  margin-bottom:22px;
 }

 .info-cards-grid{
  grid-template-columns:1fr;
  gap:10px;
  margin-bottom:22px;
 }

 .info-card{
  padding:12px;
 }

 .info-label{
  font-size:.47rem;
 }

 .info-value{
  font-size:.86rem;
 }

 .cta-group{
  flex-direction:column;
  gap:11px;
 }

 .btn-primary,
 .btn-secondary,
 .btn-guide,
 .btn-c1,
 .btn-c2,
 .btn-c3{
  width:100%;
  font-size:.52rem;
  min-height:48px;
 }

 .author-footer{
  font-size:.77rem;
 }

 .guide-steps{
  grid-template-columns:1fr;
 }

 .guide-step-item.full-span{
  grid-column:auto;
 }

 .guide-title{
  font-size:.68rem;
 }

 .cloud{
  width:37px;
  height:12px;
 }

 .cloud::before{
  width:17px;
  height:17px;
  top:-8px;
  left:6px;
 }

 .cloud::after{
  width:22px;
  height:22px;
  top:-11px;
  right:4px;
 }

 .garuda-emblem{
  margin-bottom:18px;
  padding:6px;
 }

 .garuda-emblem img{
  width:66px;
 }
}

/* PENGATURAN GERAK */
@media(prefers-reduced-motion:reduce){
 *,
 *::before,
 *::after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  transition-duration:.01ms!important;
  scroll-behavior:auto!important;
 }
}

.home-quick-actions{position:relative;z-index:2;margin:26px auto 6px;max-width:760px;padding:18px 16px 14px;border:3px dashed rgba(36,59,100,.28);border-radius:14px;background:rgba(255,255,255,.58)}
.quick-actions-label{text-align:center;font-family:var(--pixel);font-size:clamp(.48rem,1vw,.62rem);line-height:1.8;margin-bottom:14px;color:var(--ink)}
.quick-actions-grid{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.quick-actions-grid .btn-guide{text-decoration:none;min-width:150px}
@media(max-width:560px){.quick-actions-grid{display:grid;grid-template-columns:1fr}.quick-actions-grid .btn-guide{width:100%}}
.btn-c1{background:#2F7BE5;color:#fff}
.btn-c2{background:#F28C28;color:#222}
.btn-c3{background:#8C5BD9;color:#fff}
</script>
<script type="text/plain" id="css-peta">
:host{
 --sky:#5C94FC;
 --sky-light:#B9E2FF;
 --cream:#FFF8E7;
 --red:#E52521;
 --green:#43B047;
 --navy:#243B64;
 --yellow:#FFD700;
 --ink:#252525;
 --body:'Plus Jakarta Sans',sans-serif;
 --pixel:'Press Start 2P',cursive;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:host{
 width:100%;
 min-height:100%;
 font-family:var(--body);
 color:var(--navy);
 overflow-x:clip;
}


:host{
 background:linear-gradient(
  180deg,
  #5C94FC 0%,
  #A8D8FF 55%,
  #EAF7FF 100%
 );
}

/* AREA HALAMAN */
.page-wrapper{
 position:relative;
 isolation:isolate;
 min-height:100vh;
 padding:76px 24px 70px;
 overflow:hidden;
}

.content{
 position:relative;
 z-index:2;
 width:min(100%,1040px);
 margin:0 auto;
}

/* =================================
   AWAN KECIL BERGERAK DI DEPAN
================================= */
.cloud-layer{
 position:absolute;
 inset:0;
 z-index:10;
 overflow:hidden;
 pointer-events:none;
}

.cloud{
 position:absolute;
 left:0;
 width:46px;
 height:14px;
 background:rgba(255,255,255,.92);
 border-radius:30px;
 filter:drop-shadow(0 2px 2px rgba(54,112,190,.16));
 animation:cloudDrift linear infinite;
}

.cloud::before,
.cloud::after{
 content:"";
 position:absolute;
 background:inherit;
 border-radius:50%;
}

.cloud::before{
 width:21px;
 height:21px;
 top:-10px;
 left:7px;
}

.cloud::after{
 width:27px;
 height:27px;
 top:-14px;
 right:5px;
}

.cloud-1{ top:4%;  opacity:.9;  animation-duration:32s; animation-delay:-9s; }
.cloud-2{ top:17%; transform:scale(.78); opacity:.76; animation-duration:41s; animation-delay:-25s; }
.cloud-3{ top:32%; transform:scale(.68); opacity:.82; animation-duration:36s; animation-delay:-17s; }
.cloud-4{ top:50%; transform:scale(.85); opacity:.72; animation-duration:46s; animation-delay:-31s; }
.cloud-5{ top:68%; transform:scale(.72); opacity:.84; animation-duration:39s; animation-delay:-12s; }
.cloud-6{ top:86%; transform:scale(.62); opacity:.7;  animation-duration:49s; animation-delay:-37s; }

@keyframes cloudDrift{
 from{ left:-100px; }
 to{ left:calc(100% + 100px); }
}

/* =================================
   PANEL BERANDA (HEADER)
================================= */
.hero-stage{
 position:relative;
 isolation:isolate;
 margin-bottom:34px;
}

.hero-panel{
 position:relative;
 z-index:2;
 width:100%;
 padding:clamp(34px,5vw,56px) clamp(22px,5vw,62px) 34px;
 border:5px solid var(--ink);
 border-radius:24px;
 background:var(--cream);
 box-shadow:
  10px 10px 0 var(--ink),
  0 22px 55px rgba(36,59,100,.2);
 text-align:center;
 animation:fadeUp .8s ease both;
}

.hero-panel:before{
 content:"";
 position:absolute;
 inset:10px;
 border:2px dashed rgba(36,59,100,.18);
 border-radius:14px;
 pointer-events:none;
}

/* STIKER KOIN, JAMUR, DAN BINTANG */
.sticker{
 position:absolute;
 z-index:3;
 display:grid;
 place-items:center;
 pointer-events:none;
 filter:drop-shadow(3px 4px 0 rgba(37,37,37,.28));
 user-select:none;
}

.sticker-coin{
 font-size:clamp(2.5rem,5vw,4rem);
 top:-30px;
 left:8%;
 transform:rotate(-12deg);
}

.sticker-mushroom{
 font-size:clamp(2.8rem,5.5vw,4.4rem);
 right:5%;
 top:12%;
 transform:rotate(9deg);
}

.sticker-star{
 font-size:clamp(2.3rem,4.5vw,3.6rem);
 left:4%;
 bottom:13%;
 transform:rotate(12deg);
}

/* LABEL ATAS */
.top-label{
 display:inline-flex;
 align-items:center;
 gap:10px;
 padding:9px 16px;
 margin-bottom:22px;
 border:3px solid var(--ink);
 border-radius:8px;
 background:var(--yellow);
 color:var(--ink);
 font-family:var(--pixel);
 font-size:clamp(.48rem,1vw,.62rem);
 line-height:1.8;
 box-shadow:4px 4px 0 var(--ink);
 position:relative;
 z-index:1;
}

.label-dot{
 width:9px;
 height:9px;
 border-radius:50%;
 background:var(--green);
 border:2px solid var(--ink);
}

/* GARUDA PANCASILA PIXEL-ART */
.garuda-emblem{
 position:relative;
 z-index:1;
 display:flex;
 justify-content:center;
 align-items:center;
 width:fit-content;
 margin:2px auto 20px;
 padding:7px;
 background:#fff8d9;
 border:4px solid var(--ink);
 border-radius:9px;
 box-shadow:
  4px 4px 0 var(--yellow),
  6px 6px 0 var(--ink);
}

.garuda-emblem img{
 display:block;
 width:clamp(62px,8vw,88px);
 height:auto;
 image-rendering:pixelated;
 filter:drop-shadow(1px 2px 0 rgba(37,37,37,.18));
}

/* JUDUL */
.welcome-sub{
 font-size:clamp(.78rem,1.5vw,1rem);
 font-weight:800;
 letter-spacing:.22em;
 text-transform:uppercase;
 color:var(--red);
 margin-bottom:12px;
}

.hero-title{
 line-height:1.2;
 margin-bottom:18px;
 position:relative;
 z-index:1;
}

.title-script{
 display:block;
 font-family:var(--body);
 font-weight:800;
 font-size:clamp(2rem,5vw,3.4rem);
 color:var(--navy);
 letter-spacing:-.06em;
}

.title-modern{
 display:block;
 margin-top:7px;
 font-family:var(--pixel);
 font-size:clamp(1.5rem,4.8vw,3.2rem);
 line-height:1.5;
 color:var(--red);
 text-shadow:
  3px 3px 0 var(--yellow),
  5px 5px 0 var(--ink);
 overflow-wrap:anywhere;
}

.hero-description{
 max-width:700px;
 margin:0 auto;
 color:#39465B;
 font-size:clamp(.92rem,1.5vw,1.05rem);
 font-weight:600;
 line-height:1.8;
 position:relative;
 z-index:1;
}

/* =================================
   PENGANTAR
================================= */
.intro-panel{
 position:relative;
 padding:22px 26px;
 margin-bottom:38px;
 border:4px solid var(--ink);
 border-radius:16px;
 background:#fff;
 box-shadow:6px 6px 0 var(--ink);
 animation:fadeUp .8s .1s ease both;
}

.intro-panel p{
 color:#39465B;
 font-size:.95rem;
 font-weight:600;
 line-height:1.8;
 text-align:center;
}

/* =================================
   JUDUL BAGIAN
================================= */
.section-heading{
 display:flex;
 align-items:center;
 gap:14px;
 margin-bottom:26px;
}

.heading-line{
 flex:1;
 height:0;
 border-top:4px dashed var(--ink);
 opacity:.55;
}

.section-heading h2{
 padding:10px 16px;
 border:3px solid var(--ink);
 border-radius:8px;
 background:var(--yellow);
 color:var(--ink);
 font-family:var(--pixel);
 font-size:clamp(.55rem,1.4vw,.78rem);
 line-height:1.8;
 text-align:center;
 box-shadow:4px 4px 0 var(--ink);
}

/* =================================
   PETA MATERI
================================= */
.material-section{
 margin-bottom:34px;
}

.map-root{
 position:relative;
 z-index:2;
 max-width:650px;
 margin:0 auto;
 padding:24px 26px;
 text-align:center;
 border:4px solid var(--ink);
 border-radius:18px;
 background:var(--red);
 color:#fff;
 box-shadow:6px 6px 0 var(--ink);
}

.map-root:before{
 content:"";
 position:absolute;
 inset:8px;
 border:2px dashed rgba(255,255,255,.35);
 border-radius:10px;
 pointer-events:none;
}

.root-ornament{
 position:relative;
 font-size:1rem;
 letter-spacing:.6rem;
 margin-bottom:10px;
 color:var(--yellow);
}

.root-label{
 position:relative;
 display:inline-block;
 padding:6px 10px;
 margin-bottom:12px;
 border:3px solid var(--ink);
 border-radius:6px;
 background:var(--yellow);
 color:var(--ink);
 font-family:var(--pixel);
 font-size:.52rem;
 line-height:1.8;
}

.root-title{
 position:relative;
 color:#fff;
 font-family:var(--body);
 font-size:clamp(1.15rem,3vw,1.7rem);
 font-weight:800;
 line-height:1.4;
 text-shadow:2px 2px 0 var(--ink);
}

.root-caption{
 position:relative;
 margin-top:10px;
 color:rgba(255,255,255,.92);
 font-size:.8rem;
 font-weight:700;
 letter-spacing:.04em;
}

/* PENGHUBUNG MELENGKUNG */
.branch-wrapper{
 position:relative;
 z-index:1;
 width:100%;
 height:115px;
 margin:0 auto;
}

.branch-svg{
 display:block;
 width:100%;
 height:100%;
 overflow:visible;
}

.branch-path{
 fill:none;
 stroke:var(--ink);
 stroke-width:4;
 stroke-linecap:square;
 stroke-linejoin:round;
 vector-effect:non-scaling-stroke;
}

.branch-dot{
 position:absolute;
 width:16px;
 height:16px;
 border:3px solid var(--ink);
 transform:translate(-50%,-50%);
}

.branch-dot.center{
 left:50%;
 top:17.4%;
 background:var(--yellow);
}

.branch-dot.left{
 left:12.5%;
 top:80%;
 background:var(--green);
}

.branch-dot.mid-left{
 left:37.5%;
 top:80%;
 background:var(--green);
}

.branch-dot.mid-right{
 left:62.5%;
 top:80%;
 background:var(--green);
}

.branch-dot.right{
 left:87.5%;
 top:80%;
 background:var(--green);
}

.branch-label{
 position:absolute;
 left:50%;
 top:45%;
 transform:translate(-50%,-50%);
 padding:8px 14px;
 border:3px solid var(--ink);
 border-radius:8px;
 background:var(--yellow);
 color:var(--ink);
 font-family:var(--pixel);
 font-size:.5rem;
 line-height:1.8;
 white-space:nowrap;
 box-shadow:3px 3px 0 var(--ink);
}

/* KARTU MATERI */
.material-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:18px;
}

.material-card{
 position:relative;
 padding:22px 20px;
 min-height:210px;
 border:3px solid var(--ink);
 border-radius:14px;
 background:#fff;
 box-shadow:5px 5px 0 var(--ink);
 transition:transform .2s ease,box-shadow .2s ease;
 animation:fadeUp .7s ease both;
}

.material-card:nth-child(2){ background:#EAF7FF; animation-delay:.1s; }
.material-card:nth-child(3){ background:#FFF1D0; animation-delay:.2s; }
.material-card:nth-child(4){ background:#EAF8E6; animation-delay:.3s; }

.material-card:hover{
 transform:translate(-2px,-4px);
 box-shadow:7px 9px 0 var(--ink);
}

.card-top{
 display:flex;
 align-items:flex-start;
 gap:14px;
 margin-bottom:14px;
}

.card-number{
 flex-shrink:0;
 width:44px;
 height:44px;
 display:flex;
 align-items:center;
 justify-content:center;
 border:3px solid var(--ink);
 border-radius:8px;
 background:var(--red);
 color:#fff;
 font-family:var(--pixel);
 font-size:.7rem;
 box-shadow:3px 3px 0 var(--ink);
}

.material-card:nth-child(2) .card-number{ background:var(--sky); }
.material-card:nth-child(3) .card-number{ background:var(--yellow); color:var(--ink); }
.material-card:nth-child(4) .card-number{ background:var(--green); }

.card-title{
 color:var(--navy);
 font-family:var(--body);
 font-size:1.05rem;
 font-weight:800;
 line-height:1.45;
 padding-top:2px;
}

.card-summary{
 color:#39465B;
 font-size:.88rem;
 font-weight:500;
 line-height:1.7;
 margin-bottom:16px;
}

.keyword-list{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.keyword{
 padding:5px 10px;
 border:2px solid var(--ink);
 border-radius:6px;
 background:var(--cream);
 color:var(--ink);
 font-size:.72rem;
 font-weight:700;
}

/* CATATAN PENUTUP */
.closing-note{
 max-width:800px;
 margin:34px auto 0;
 padding:20px 24px;
 border:3px solid var(--ink);
 border-radius:14px;
 background:#FFF1D0;
 box-shadow:5px 5px 0 var(--ink);
 color:#39465B;
 font-size:.9rem;
 font-weight:600;
 line-height:1.8;
 text-align:center;
}

.closing-note span{
 display:inline-block;
 margin-right:6px;
 color:var(--red);
 font-family:var(--pixel);
 font-size:.62rem;
}

/* FOOTER */
.footer{
 position:relative;
 z-index:2;
 padding-top:22px;
 border-top:3px dashed rgba(36,59,100,.35);
 text-align:center;
}

.footer-brand{
 color:var(--red);
 font-family:var(--pixel);
 font-size:.66rem;
 line-height:1.8;
 text-shadow:2px 2px 0 var(--yellow);
}

.footer p{
 margin-top:10px;
 color:#4b5668;
 font-size:.82rem;
 font-weight:600;
 line-height:1.8;
}

.footer .author{
 color:var(--navy);
 font-weight:700;
}

/* ANIMASI */
@keyframes fadeUp{
 from{
  opacity:0;
  transform:translateY(16px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

/* RESPONSIVE */
@media(max-width:680px){

 .page-wrapper{
  padding:58px 16px 56px;
 }

 .hero-panel{
  padding:42px 20px 25px;
  border-width:4px;
  box-shadow:6px 6px 0 var(--ink);
 }

 .top-label{
  font-size:.42rem;
  padding:7px 10px;
  margin-bottom:18px;
 }

 .welcome-sub{
  letter-spacing:.12em;
 }

 .title-script{
  font-size:2.2rem;
 }

 .title-modern{
  font-size:1.45rem;
  text-shadow:
   2px 2px 0 var(--yellow),
   3px 3px 0 var(--ink);
 }

 .hero-description{
  font-size:.88rem;
 }

 .garuda-emblem{
  margin-bottom:18px;
  padding:6px;
 }

 .garuda-emblem img{
  width:66px;
 }

 .intro-panel{
  padding:18px 16px;
  box-shadow:4px 4px 0 var(--ink);
 }

 .intro-panel p{
  font-size:.86rem;
 }

 .map-root{
  padding:20px 16px;
  box-shadow:4px 4px 0 var(--ink);
 }

 .branch-wrapper{
  height:85px;
 }

 .branch-label{
  font-size:.42rem;
  padding:6px 10px;
 }

 .material-grid{
  gap:14px;
 }

 .material-card{
  padding:18px 16px;
 }

 .card-title{
  font-size:.98rem;
 }

 .card-summary{
  font-size:.82rem;
 }

 .cloud{
  width:37px;
  height:12px;
 }

 .cloud::before{
  width:17px;
  height:17px;
  top:-8px;
  left:6px;
 }

 .cloud::after{
  width:22px;
  height:22px;
  top:-11px;
  right:4px;
 }
}

@media(max-width:480px){

 .material-grid{
  grid-template-columns:1fr;
 }

 .material-card{
  min-height:auto;
 }

 .branch-wrapper{
  height:65px;
 }

 .heading-line{
  display:none;
 }

 .closing-note{
  font-size:.82rem;
  padding:16px;
 }
}

/* PENGATURAN GERAK */
@media(prefers-reduced-motion:reduce){
 *,
 *::before,
 *::after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  transition-duration:.01ms!important;
  scroll-behavior:auto!important;
 }
}
</script>
<script type="text/plain" id="css-materi">
/* ==================================================
   1. PALET WARNA SUPER MARIO BROS
================================================== */
:host{
    --mario-red: #E52521;
    --sky-blue: #5C94FC;
    --light-sky: #A8D8FF;
    --grass-green: #43B047;
    --pipe-green: #008C45;
    --coin-yellow: #FFD700;
    --block-brown: #A65E2E;
    --brick-orange: #E98B35;
    --cloud-white: #FFFFFF;
    --cream-bg: #FFF8E7;
    --dark-navy: #243B64;
    --font-heading: 'Press Start 2P', cursive;
    --font-body: 'Plus Jakarta Sans', sans-serif;
}

/* ==================================================
   2. RESET DAN DASAR
================================================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


:host{
    min-height: 100vh;
    background: linear-gradient(
        180deg,
        var(--sky-blue) 0%,
        var(--light-sky) 50%,
        #E3F2FD 100%
    );
    color: var(--dark-navy);
    font-family: var(--font-body);
    line-height: 1.7;
    overflow-x: clip;
    position: relative;
}

button, a {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
a:focus-visible {
    outline: 4px solid var(--coin-yellow);
    outline-offset: 4px;
}

/* ==================================================
   3. BACKGROUND DAN DEKORASI
================================================== */
.ambient-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.cloud-decor {
    position: absolute;
    background: white;
    border-radius: 50px;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,0.1);
    animation: driftCloud 35s linear infinite;
    opacity: 0.9;
}

.cloud-decor::before,
.cloud-decor::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud-1 {
    width: 160px;
    height: 60px;
    top: 8%;
    left: -180px;
    animation-duration: 40s;
}

.cloud-1::before {
    width: 70px;
    height: 70px;
    top: -35px;
    left: 20px;
}

.cloud-1::after {
    width: 50px;
    height: 50px;
    top: -25px;
    left: 80px;
}

.cloud-2 {
    width: 200px;
    height: 70px;
    top: 35%;
    right: -220px;
    animation-duration: 50s;
    animation-delay: -12s;
}

.cloud-2::before {
    width: 80px;
    height: 80px;
    top: -40px;
    left: 30px;
}

.cloud-2::after {
    width: 60px;
    height: 60px;
    top: -30px;
    left: 100px;
}

.cloud-3 {
    width: 130px;
    height: 50px;
    top: 68%;
    left: -150px;
    animation-duration: 32s;
    animation-delay: -5s;
}

.cloud-3::before {
    width: 55px;
    height: 55px;
    top: -25px;
    left: 20px;
}

@keyframes driftCloud {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(calc(100vw + 300px));
    }
}

/* Tanah hijau */
.mario-hills {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 35px;
    background: var(--grass-green);
    border-top: 4px solid #222;
    z-index: 1;
    pointer-events: none;
    box-shadow: inset 0 8px 0 rgba(255,255,255,0.2);
}

/* Karakter dan benda dekoratif */
.luigi-peeking,
.mario-jumping,
.coin-decor,
.mushroom-decor,
.star-decor,
.question-block-decor {
    position: absolute;
    pointer-events: none;
    z-index: 4;
    display: grid;
    place-items: center;
}

.luigi-peeking {
    position: fixed;
    right: 5px;
    top: 25vh;
    font-size: 3.5rem;
    animation: peekingLuigi 5s ease-in-out infinite alternate;
}

.luigi-peeking::before {
    content: "🧑‍🔧";
}

@keyframes peekingLuigi {
    0%, 100% {
        transform: translateX(12px) rotate(5deg);
    }
    50% {
        transform: translateX(-8px) rotate(-5deg);
    }
}

.mario-jumping {
    top: 25px;
    right: 35px;
    width: 75px;
    height: 75px;
    font-size: 3.5rem;
    animation: jumpMario 3s ease-in-out infinite;
}

.mario-jumping::before {
    content: "🍄";
}

@keyframes jumpMario {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-22px);
    }
}

.coin-decor {
    width: 35px;
    height: 35px;
    font-size: 1.8rem;
    animation: rotateCoin 2s linear infinite;
}

.coin-decor::before {
    content: "🪙";
}

@keyframes rotateCoin {
    from {
        transform: rotateY(0deg);
    }
    to {
        transform: rotateY(360deg);
    }
}

.mushroom-decor {
    width: 45px;
    height: 45px;
    font-size: 2rem;
    animation: floatMushroom 4s ease-in-out infinite alternate;
}

.mushroom-decor::before {
    content: "🍄";
}

@keyframes floatMushroom {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-12px);
    }
}

.star-decor {
    width: 40px;
    height: 40px;
    font-size: 2rem;
    animation: sparkleStar 2.5s ease-in-out infinite alternate;
}

.star-decor::before {
    content: "⭐";
}

@keyframes sparkleStar {
    from {
        transform: scale(0.9) rotate(0deg);
        opacity: 0.8;
    }
    to {
        transform: scale(1.1) rotate(15deg);
        opacity: 1;
        filter: drop-shadow(0 0 8px var(--coin-yellow));
    }
}

.question-block-decor {
    width: 45px;
    height: 45px;
    background: var(--brick-orange);
    border: 3px solid #222;
    border-radius: 5px;
    font-size: 1.7rem;
    animation: bounceBlock 1.5s ease-in-out infinite;
}

.question-block-decor::before {
    content: "?";
    color: white;
    font-weight: 800;
}

@keyframes bounceBlock {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

/* ==================================================
   4. NAVIGASI
================================================== */
.section-navigator {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 12px 0;
    background: rgba(36, 59, 100, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 4px solid var(--coin-yellow);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.nav-container {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scrollbar-width: none;
}

.nav-container::-webkit-scrollbar {
    display: none;
}

.nav-link {
    flex-shrink: 0;
    text-decoration: none;
    color: white;
    background: var(--mario-red);
    border: 3px solid #111;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.62rem;
    font-family: var(--font-heading);
    box-shadow: 0 4px 0 #111;
    transition: 0.15s;
}

.nav-link:hover,
.nav-link.active {
    color: #111;
    background: var(--coin-yellow);
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #111;
}

/* ==================================================
   5. KONTEN UTAMA DAN HEADER
================================================== */
.page-wrapper {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px 90px;
    position: relative;
    z-index: 2;
}

.header-section {
    position: relative;
    text-align: center;
    padding: 55px 35px;
    margin-bottom: 55px;
    border-radius: 20px;
    border: 4px solid #222;
    background: var(--cream-bg);
    box-shadow: 8px 8px 0 #222;
    overflow: hidden;
}

.site-label {
    display: inline-block;
    color: var(--mario-red);
    font-size: 0.65rem;
    font-family: var(--font-heading);
    text-transform: uppercase;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

.main-title {
    font-family: var(--font-heading);
    font-size: clamp(1.5rem, 4vw, 3rem);
    line-height: 1.4;
    margin-bottom: 12px;
    color: var(--dark-navy);
    text-shadow: 3px 3px 0 var(--coin-yellow);
}

.main-subtitle {
    color: var(--mario-red);
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 22px;
}

.intro-divider {
    width: 100px;
    height: 4px;
    margin: 0 auto 20px;
    background: var(--pipe-green);
    border: 1px solid #222;
}

.intro-text {
    max-width: 820px;
    margin: auto;
    color: #333;
    font-size: 0.95rem;
    line-height: 1.9;
    font-weight: 600;
}

/* ==================================================
   6. JUDUL BAGIAN
================================================== */
.material-section {
    margin-bottom: 65px;
    scroll-margin-top: 110px;
}

.section-header-box {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 28px;
}

.section-header-box h2 {
    font-family: var(--font-heading);
    font-size: clamp(0.75rem, 2vw, 1.15rem);
    color: #222;
    background: var(--coin-yellow);
    padding: 12px 16px;
    border: 3px solid #222;
    border-radius: 8px;
    box-shadow: 4px 4px 0 #222;
    line-height: 1.7;
}

.section-line {
    height: 6px;
    flex: 1;
    background: var(--pipe-green);
    border: 2px solid #222;
    border-radius: 4px;
}

.section-description {
    color: var(--dark-navy);
    font-weight: 700;
    font-size: 0.95rem;
    margin: -12px 0 25px;
}

/* ==================================================
   7. KARTU E-MODUL
================================================== */
.hero-emodul-card {
    display: grid;
    grid-template-columns: 350px 1fr;
    overflow: hidden;
    border-radius: 18px;
    border: 4px solid #222;
    background: var(--cream-bg);
    box-shadow: 8px 8px 0 #222;
    transition: 0.25s;
    position: relative;
}

.hero-emodul-card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 11px 11px 0 #222;
}

.hero-thumb-wrapper {
    width: 100%;
    min-height: 310px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-thumb-wrapper a {
    display: block;
    width: 100%;
    height: 100%;
}

.hero-thumb-wrapper img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 310px;
    object-fit: cover;
    object-position: center top;

}

.hero-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 6px 12px;
    border-radius: 6px;
    background: var(--coin-yellow);
    border: 2px solid #222;
    color: #222;
    font-size: 0.58rem;
    font-family: var(--font-heading);
    box-shadow: 3px 3px 0 #222;
}

.hero-content {
    padding: 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.hero-title {
    font-family: var(--font-heading);
    font-size: clamp(0.9rem, 2vw, 1.25rem);
    line-height: 1.7;
    margin-bottom: 14px;
    color: var(--mario-red);
}

.hero-desc {
    color: #333;
    font-weight: 600;
    font-size: 0.92rem;
    margin-bottom: 22px;
}

.material-coverage {
    padding: 16px;
    border-radius: 12px;
    border: 3px solid #222;
    background: #FFF9E6;
    margin-bottom: 23px;
    box-shadow: 4px 4px 0 #222;
}

.coverage-title {
    font-size: 0.62rem;
    font-family: var(--font-heading);
    color: var(--mario-red);
    margin-bottom: 12px;
}

.coverage-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.coverage-tag {
    background: white;
    border: 2px solid #222;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 700;
    color: #222;
    box-shadow: 2px 2px 0 #222;
}

/* ==================================================
   8. BACAAN DIGITAL
================================================== */
.reading-grid,
.video-grid,
.infographic-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
}
/* Setiap kartu video memiliki tinggi mandiri */
.video-grid {
    align-items: start;
}

.video-card {
    height: auto;
    align-self: start;
}

.reading-card,
.video-card,
.infographic-card {
    border: 4px solid #222;
    border-radius: 18px;
    background: var(--cream-bg);
    box-shadow: 6px 6px 0 #222;
    transition: 0.25s;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
}

.reading-card {
    padding: 24px;
}

.reading-card:hover,
.video-card:hover,
.infographic-card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0 #222;
}

.reading-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 15px;
}

.reading-type {
    color: #222;
    background: var(--coin-yellow);
    border: 2px solid #222;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.58rem;
    font-family: var(--font-heading);
    box-shadow: 2px 2px 0 #222;
}

.reading-author {
    color: var(--mario-red);
    font-size: 0.75rem;
    font-weight: 800;
}

.reading-title,
.video-title,
.infographic-title {
    font-family: var(--font-heading);
    font-size: 0.78rem;
    line-height: 1.8;
    margin-bottom: 12px;
    color: var(--dark-navy);
}

.reading-desc,
.video-desc,
.infographic-desc {
    font-size: 0.86rem;
    color: #333;
    font-weight: 600;
    line-height: 1.8;
    margin-bottom: 18px;
}

.material-note {
    color: var(--pipe-green);
    font-weight: 700;
    font-size: 0.76rem;
    margin: 12px 0;
}

/* ==================================================
   9. VIDEO PEMBELAJARAN
================================================== */
.video-card {
    padding: 0;
}

.video-thumb-container {
    position: relative;
    height: 205px;
    background: var(--sky-blue);
    overflow: hidden;
    border-bottom: 4px solid #222;
}

.video-thumb-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: 0.3s;
}

.video-card:hover .video-thumb-container img {
    transform: scale(1.05);
}

.play-button-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--mario-red);
    border: 3px solid #222;
    color: white;
    font-size: 1.2rem;
    box-shadow: 4px 4px 0 #222;
}

.video-channel,
.video-duration {
    position: absolute;
    padding: 4px 10px;
    border-radius: 6px;
    background: #222;
    color: var(--coin-yellow);
    font-size: 0.57rem;
    font-family: var(--font-heading);
    border: 1px solid #444;
}

.video-channel {
    top: 12px;
    left: 12px;
}

.video-duration {
    bottom: 12px;
    right: 12px;
    color: white;
}

.video-content,
.infographic-content {
    padding: 22px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.video-actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: auto;
}

.video-action {
    width: 100%;
}

.video-action:hover {
    cursor: pointer;

}

/* ==================================================
   10. INFOGRAFIS
================================================== */
.infographic-card {
    padding: 0;
}

.infographic-thumb {
    position: relative;
    height: 340px;
    background: #fff;
    overflow: hidden;
    cursor: zoom-in;
    border-bottom: 4px solid #222;
}

.infographic-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #fff;
    display: block;
    transition: 0.3s;
}

.infographic-card:hover .infographic-thumb img {
    transform: none;
}

.zoom-hint {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 6px 12px;
    background: #222;
    color: var(--coin-yellow);
    border: 2px solid var(--coin-yellow);
    border-radius: 6px;
    font-size: 0.56rem;
    font-family: var(--font-heading);
}

/* ==================================================
   11. TOMBOL
================================================== */
.btn-primary,
.btn-secondary {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 0.63rem;
    font-family: var(--font-heading);
    line-height: 1.8;
    transition: 0.15s;
    text-align: center;
    border: 3px solid #222;
    box-shadow: 4px 4px 0 #222;
}

.btn-primary {
    color: white;
    background: var(--mario-red);
}

.btn-primary:hover {
    background: #FF4136;
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #222;
}

.btn-secondary {
    color: #222;
    background: var(--coin-yellow);
}

.btn-secondary:hover {
    background: #FFEA75;
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #222;
}

.full-width {
    width: 100%;
}

/* ==================================================
   12. MODAL
================================================== */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 950px;
    max-height: 90vh;
    overflow: hidden;
    border: 4px solid #222;
    border-radius: 18px;
    background: var(--cream-bg);
    box-shadow: 10px 10px 0 var(--coin-yellow);
    animation: modalIn 0.25s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(0.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.modal-header {
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: var(--mario-red);
    border-bottom: 4px solid #222;
}

.modal-title {
    color: white;
    font-family: var(--font-heading);
    font-size: 0.72rem;
    line-height: 1.7;
}

.modal-close {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border: 2px solid #222;
    border-radius: 8px;
    color: #222;
    background: var(--coin-yellow);
    font-size: 1.1rem;
    font-weight: bold;
}

.modal-body {
    padding: 20px;
    max-height: calc(90vh - 75px);
    overflow: auto;
    text-align: center;
}

.modal-body img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    border: 3px solid #222;
}

.video-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 3px solid #222;
    border-radius: 8px;
    background: black;
}

/* ==================================================
   13. FOOTER
================================================== */
.page-footer {
    position: relative;
    z-index: 2;
    margin-top: 50px;
    padding: 50px 20px;
    text-align: center;
    border-top: 4px solid #222;
    background: var(--dark-navy);
    color: white;
}

.footer-brand {
    color: var(--coin-yellow);
    font-family: var(--font-heading);
    font-size: 0.95rem;
    margin-bottom: 12px;
    line-height: 1.8;
}

.footer-desc {
    max-width: 550px;
    margin: 0 auto 15px;
    color: #DDD;
    font-size: 0.85rem;
}

.footer-copy {
    color: var(--light-sky);
    font-size: 0.75rem;
    font-weight: bold;
}

/* ==================================================
   14. RESPONSIVE DESIGN
================================================== */

    }

    }

    .main-title {

    .hero-content {

    }

    .hero-title {
        font-size: 0.85rem;
    }

    .hero-desc {
        font-size: 0.85rem;
    }

    .coverage-title {
        font-size: 0.55rem;
    }

    .coverage-tag {
        font-size: 0.68rem;
    }

    .reading-title,

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {

        transition-duration: 0.01ms !important;
    }
}

/* ==================================================
   15. KARAKTER & ITEM ASLI DARI ASET GOOGLE DRIVE
   Posisi dapat disesuaikan melalui variabel --x, --y, --w.
================================================== */
.asset-sprite {
    position: absolute;
    display: block;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    z-index: 3;
    filter: drop-shadow(0 5px 3px rgba(36,59,100,.18));
}
.luigi-peeking {
    position: fixed;
    width: clamp(76px, 9vw, 124px);
    height: auto;
    right: -30px;
    top: 27vh;
    z-index: 8;
    animation: luigiPeek 5.8s ease-in-out infinite;
}
@keyframes luigiPeek {
    0%, 100% { transform: translateX(45px) rotate(4deg); }
    45%, 65% { transform: translateX(0) rotate(-2deg); }
}
.mario-jumping {
    width: clamp(82px, 10vw, 132px);
    height: 132px;
    object-fit: contain;
    top: 22px;
    right: 34px;
    animation: marioHop 2.7s ease-in-out infinite;
}
@keyframes marioHop {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    48% { transform: translateY(-24px) rotate(3deg); }
}
.hero-mushroom { width: 76px; height: 76px; right: 28px; bottom: 8px; animation: floatItem 3.7s ease-in-out infinite; }
.hero-peek-princess { width: 100px; height: 125px; left: 12px; bottom: 8px; }
.hero-crab { width: 76px; height: 76px; left: 18px; top: 48%; animation: floatItem 4.6s ease-in-out infinite; }
.emodul-pair { width: 118px; height: 142px; left: -20px; bottom: -30px; z-index: 4; }
.emodul-brick { width: 62px; height: 62px; right: 18px; top: -30px; z-index: 5; }
.reading-mushroom { width: 62px; height: 72px; right: -10px; top: 40%; }
.reading-star { width: 48px; height: 48px; left: -14px; top: 17%; animation: starTwinkle 2.8s ease-in-out infinite; }
.video-turtle { width: 90px; height: 105px; right: -16px; top: 36%; animation: gentleBounce 3.8s ease-in-out infinite; }
.video-plant { width: 70px; height: 90px; left: -15px; bottom: 8%; }
.infographic-princess { width: 105px; height: 130px; right: -12px; top: 25%; animation: gentleBounce 4.4s ease-in-out infinite; }
.infographic-pixel-mushroom { width: 56px; height: 56px; left: -12px; bottom: 10%; }
.hero-start { margin-top: 24px; min-width: 210px; }
.material-section { position: relative; }
.header-section { isolation: isolate; }
.header-section > :not(.asset-sprite) { position: relative; z-index: 4; }
.hero-emodul-card, .reading-card, .video-card, .infographic-card { z-index: 2; }
.reading-card:nth-child(2n) { background: #F0F8FF; }
.reading-card:nth-child(3n) { background: #F0FFF1; }
.reading-card:nth-child(4n) { background: #FFF7D6; }
.reading-card:nth-child(2) .reading-type { background: #BDE0FF; }
.reading-card:nth-child(3) .reading-type { background: #BCECC2; }
.reading-card:nth-child(4) .reading-type { background: #FFD7D2; }
.footer-world { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.footer-pipe { width: 100px; height: 120px; right: 5%; bottom: 0; }
.footer-grass { width: 100%; height: 48px; left: 0; bottom: 0; object-fit: cover; opacity: .95; }
.footer-team { width: 190px; height: 150px; left: 4%; bottom: 0; }
.footer-mushroom { width: 62px; height: 62px; right: 22%; bottom: 18px; animation: floatItem 3.5s ease-in-out infinite; }
.page-footer > :not(.footer-world) { position: relative; z-index: 5; }
@keyframes floatItem { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes gentleBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes starTwinkle { 0%,100% { transform: rotate(-8deg) scale(.94); opacity:.85; } 50% { transform: rotate(10deg) scale(1.08); opacity:1; } }
@media (max-width: 900px) {
    .hero-crab { width: 58px; left: 4px; }
    .hero-peek-princess { width: 76px; height: 100px; }
    .emodul-pair { width: 90px; height: 110px; }
    .video-turtle, .infographic-princess { width: 66px; height: 86px; }
}
@media (max-width: 650px) {
    .luigi-peeking { width: 66px; right: -34px; top: 30vh; }
    .mario-jumping { width: 54px; height: 66px; right: 8px; top: 10px; }
    .hero-mushroom { width: 48px; height: 48px; right: 8px; bottom: 4px; }
    .hero-peek-princess, .hero-crab, .emodul-pair, .emodul-brick,
    .reading-mushroom, .reading-star, .video-turtle, .video-plant,
    .infographic-princess, .infographic-pixel-mushroom { opacity: .68; }
    .hero-peek-princess { width: 48px; height: 68px; left: 2px; }
    .hero-crab { width: 42px; height: 48px; top: 62%; }
    .emodul-pair { width: 65px; height: 80px; left: -10px; bottom: -15px; }
    .emodul-brick { width: 40px; height: 40px; right: 8px; }
    .reading-mushroom, .reading-star, .video-turtle, .video-plant,
    .infographic-princess, .infographic-pixel-mushroom { width: 42px; height: 48px; }
    .footer-team { width: 112px; height: 92px; left: 0; }
    .footer-pipe { width: 64px; height: 82px; right: 2%; }
    .footer-grass { height: 30px; }
    .footer-mushroom { width: 40px; height: 40px; right: 22%; }
}
@media (prefers-reduced-motion: reduce) {
    .asset-sprite, .luigi-peeking, .mario-jumping { animation: none !important; }
}


/* ==================================================
   AWAN KECIL, TRANSPARAN, DI DEPAN KONTEN
   (tidak bisa diklik dan tidak menutupi tulisan)
================================================== */
.ambient-glow { z-index: 30; }
.cloud-decor {
    background: #fff;
    opacity: .45;
    box-shadow: none;
    filter: drop-shadow(0 2px 2px rgba(54,112,190,.14));
    right: auto;
}
.cloud-decor::before, .cloud-decor::after { background: #fff; }
.cloud-1 { width: 56px; height: 18px; top: 9%;  left: -80px; }
.cloud-1::before { width: 26px; height: 26px; top: -13px; left: 8px; }
.cloud-1::after  { width: 20px; height: 20px; top: -10px; left: 30px; }
.cloud-2 { width: 46px; height: 15px; top: 30%; left: -80px; }
.cloud-2::before { width: 22px; height: 22px; top: -11px; left: 7px; }
.cloud-2::after  { width: 17px; height: 17px; top: -8px;  left: 25px; }
.cloud-3 { width: 42px; height: 14px; top: 52%; left: -80px; }
.cloud-3::before { width: 20px; height: 20px; top: -10px; left: 6px; }
.cloud-3::after  { width: 16px; height: 16px; top: -8px;  left: 22px; }
.cloud-4 { width: 50px; height: 16px; top: 70%; left: -80px; animation-duration: 44s; animation-delay: -20s; }
.cloud-4::before { width: 23px; height: 23px; top: -11px; left: 7px; }
.cloud-4::after  { width: 18px; height: 18px; top: -9px;  left: 27px; }
.cloud-5 { width: 38px; height: 13px; top: 86%; left: -80px; animation-duration: 36s; animation-delay: -8s; }
.cloud-5::before { width: 18px; height: 18px; top: -9px; left: 6px; }
.cloud-5::after  { width: 14px; height: 14px; top: -7px; left: 20px; }

@media(max-width:640px){.card{padding:18px}.fdo{grid-template-columns:1fr}.btn{font-size:.52rem;padding:12px 12px}}
@media print{:host *{visibility:hidden}#refl,#refl *{visibility:visible}#refl{position:absolute;left:0;top:0;width:100%;box-shadow:none}.noprint{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</script>

.btn.y{background:var(--coin-yellow);color:#222}.btn.g{background:var(--pipe-green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-family:var(--font-heading);font-size:.55rem;background:var(--coin-yellow);color:#222;border:2px solid #222;border-radius:6px;padding:5px 10px;box-shadow:2px 2px 0 #222;margin-bottom:12px;line-height:1.7}
h1,h2,h3{font-family:var(--font-heading);line-height:1.6}
/* pembuka */
.intro{text-align:center;padding:44px 26px}
.intro h1{font-size:clamp(1.1rem,3.6vw,2.1rem);color:var(--dark-navy);text-shadow:3px 3px 0 var(--coin-yellow);margin:8px 0 12px}
.intro .sub{max-width:680px;margin:0 auto 20px;font-weight:700;color:var(--mario-red)}
.mascots{display:flex;justify-content:center;align-items:flex-end;gap:18px;min-height:112px;margin-bottom:6px}
.mascots svg,.mascots img{width:auto;height:104px;animation:hop 2.6s ease-in-out infinite;shape-rendering:crispEdges}
.mascots>*:nth-child(2){animation-delay:-.6s;height:70px}
.mascots span.em{font-size:3rem;animation:hop 3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0}
.fact{background:#fff;border:3px solid #222;border-radius:8px;padding:6px 12px;font-weight:800;font-size:.82rem;box-shadow:3px 3px 0 #222}
.howto{text-align:left;max-width:640px;margin:0 auto 24px;background:#FFF9E6;border:3px solid #222;border-radius:12px;padding:14px 20px 14px 36px;box-shadow:4px 4px 0 #222;font-weight:600;font-size:.9rem}
.howto b{font-family:var(--font-heading);font-size:.6rem;color:var(--mario-red);display:block;margin-left:-16px;margin-bottom:6px}
/* kuis */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.top .lbl{font-family:var(--font-heading);font-size:.6rem;color:#fff;text-shadow:2px 2px 0 #222;line-height:1.8}
.bar{height:22px;background:#fff;border:3px solid #222;border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:3px 3px 0 #222}
.bar i{display:block;height:100%;width:5%;background:repeating-linear-gradient(45deg,var(--coin-yellow) 0 10px,#FFE866 10px 20px);border-right:3px solid #222;transition:width .4s}
.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-bottom:18px}
.qnav button{aspect-ratio:1;border:3px solid #222;border-radius:8px;background:#fff;font-family:var(--font-heading);font-size:.55rem;color:#222;box-shadow:2px 2px 0 #222;position:relative}
.qnav button.done{background:#A5DCA4}
.qnav button.cur{background:var(--coin-yellow);transform:translateY(-3px);box-shadow:2px 5px 0 #222}
.legend{font-size:.74rem;font-weight:700;margin:-8px 0 16px;color:#fff;text-shadow:1px 1px 0 #222}
.qn{font-size:clamp(.8rem,2.4vw,1.1rem);color:var(--mario-red);margin-bottom:12px}
.qt{font-size:1.05rem;font-weight:700;margin-bottom:16px;line-height:1.75}
.in{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-bottom:11px;padding:12px 14px;background:#fff;border:3px solid #222;border-radius:12px;box-shadow:4px 4px 0 #222;color:var(--dark-navy);font-weight:600;transition:.15s}
.opt:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #222;background:#FFFBEA}
.opt b{flex:0 0 32px;height:32px;display:grid;place-items:center;background:var(--sky-blue);color:#fff;border:2px solid #222;border-radius:8px;font-family:var(--font-heading);font-size:.62rem}
.opt.sel{background:#FFE98A;box-shadow:1px 1px 0 #222;transform:translate(3px,3px)}
.opt.sel b{background:var(--mario-red)}
.scene{display:block;width:100%;max-width:520px;margin:0 auto 16px;border:4px solid #222;border-radius:14px;box-shadow:5px 5px 0 #222;background:#fff}
.story{background:#E8F4FF;border:3px dashed #222;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:600}
.tfbox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfbox .opt{justify-content:center;font-family:var(--font-heading);font-size:.7rem;padding:20px 10px;margin:0}
.mrow{display:grid;grid-template-columns:1fr minmax(150px,230px);gap:10px;align-items:center;background:#fff;border:3px solid #222;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
select{padding:9px;border:3px solid #222;border-radius:8px;background:#FFF9E6;font-weight:700;color:var(--dark-navy)}
.slots{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.slot{flex:1 1 150px;min-height:62px;border:3px dashed #222;border-radius:12px;background:#E8F4FF;padding:8px 10px;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:8px;text-align:left;color:var(--dark-navy)}
.slot.f{background:#FFE98A;border-style:solid;box-shadow:3px 3px 0 #222}
.slot em{font-family:var(--font-heading);font-style:normal;font-size:.7rem;color:var(--mario-red)}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.pool .opt{width:auto;margin:0;flex:1 1 220px}
.pool .opt:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 #222}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cards4 .opt{flex-direction:column;margin:0;height:100%}
.cards4 .opt b{background:var(--pipe-green)}
.navbtns{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.warn{display:none;margin-top:16px;background:#FFE1E1;border:3px solid #222;border-radius:12px;padding:12px 16px;font-weight:700;box-shadow:3px 3px 0 #222}
.warn.show{display:block}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.mbox{max-width:460px;width:100%;text-align:center;background:var(--cream-bg);border:4px solid #222;border-radius:18px;box-shadow:8px 8px 0 var(--coin-yellow);padding:26px;animation:pop .25s}
.mbox h3{font-size:.8rem;color:var(--mario-red);margin-bottom:12px}
.mbox .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* hasil */
.res{text-align:center;overflow:hidden}
.score{font-family:var(--font-heading);font-size:clamp(2.4rem,9vw,4.6rem);color:var(--mario-red);text-shadow:4px 4px 0 var(--coin-yellow);margin:6px 0}
.gelar{font-family:var(--font-heading);font-size:clamp(.75rem,2.6vw,1.05rem);color:var(--dark-navy);background:var(--coin-yellow);border:3px solid #222;border-radius:10px;box-shadow:4px 4px 0 #222;display:inline-block;padding:12px 16px;margin:8px 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat{background:#fff;border:3px solid #222;border-radius:12px;box-shadow:3px 3px 0 #222;padding:10px}
.stat b{display:block;font-family:var(--font-heading);font-size:1.05rem;color:var(--pipe-green)}
.stat.x b{color:var(--bad)}.stat small{font-weight:700}
.medal{font-size:3.4rem;animation:hop 1.8s ease-in-out infinite;display:inline-block}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards;border:1px solid #222}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.sec-title{font-size:clamp(.75rem,2.2vw,1.05rem);background:var(--coin-yellow);color:#222;display:inline-block;border:3px solid #222;border-radius:8px;box-shadow:4px 4px 0 #222;padding:10px 14px;margin:30px 0 16px}
.rv{border:4px solid #222;border-radius:14px;box-shadow:5px 5px 0 #222;background:var(--cream-bg);padding:16px 18px;margin-bottom:16px;border-left-width:12px}
.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--bad)}
.rv h4{font-family:var(--font-heading);font-size:.62rem;line-height:1.8;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rv .badge{padding:3px 10px;border:2px solid #222;border-radius:6px;color:#fff}
.ok .badge{background:var(--ok)}.no .badge{background:var(--bad)}
.rv p{margin:4px 0;font-size:.9rem;font-weight:600}
.rv .ans{padding:6px 10px;border-radius:8px;border:2px solid #222;background:#fff;white-space:pre-line}
.rv .ans.c{background:#DFF5E3}.rv .ans.w{background:#FFE1E1}
.rv .ex{background:#FFF3C4;border:2px dashed #222;border-radius:8px;padding:8px 10px}
/* refleksi */
.rf label{display:block;font-weight:800;margin:16px 0 6px}
.rf textarea,.rf input{width:100%;padding:12px;border:3px solid #222;border-radius:10px;background:#fff;color:var(--dark-navy);min-height:48px}
.rf textarea{min-height:96px;resize:vertical}
.msg{display:none;margin-top:16px;background:#DFF5E3;border:3px solid #222;border-radius:12px;padding:14px 16px;font-weight:700;box-shadow:3px 3px 0 #222}
.msg.show{display:block;animation:pop .3s}
footer{position:relative;z-index:2;text-align:center;color:#fff;background:var(--dark-navy);border-top:4px solid #222;padding:28px 16px 60px;font-size:.8rem}
footer b{display:block;font-family:var(--font-heading);color:var(--coin-yellow);font-size:.7rem;margin-bottom:8px}
@media(max-width:640px){.card{padding:18px}.qnav{grid-template-columns:repeat(5,1fr)}.tfbox,.cards4{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}.btn{font-size:.55rem;padding:12px 14px}}
@media print{:host *{visibility:hidden}#refleksi,#refleksi *{visibility:visible}#refleksi{position:absolute;left:0;top:0;width:100%;box-shadow:none}.noprint{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

  document.body.style.overflow='hidden';
  closeBtn.focus();
 }

 function closeGuide(){
  modal.classList.remove('active');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  openBtn.focus();
 }

 openBtn.addEventListener('click',openGuide);
 closeBtn.addEventListener('click',closeGuide);

 modal.addEventListener('click',function(event){
  if(event.target===modal)closeGuide();
 });

 document.addEventListener('keydown',function(event){
  if(event.key==='Escape'&&modal.classList.contains('active')){
   closeGuide();
  }
 });

})();

}});

        {judul:"3. Persatuan Indonesia", paragraf:["Sila ketiga mengajarkan pentingnya menjaga keutuhan bangsa di tengah keberagaman suku, agama, budaya, dan daerah. Kepentingan bersama perlu diutamakan tanpa menghapus identitas setiap kelompok."], poin:["Bekerja sama tanpa membeda-bedakan latar belakang.","Menghargai budaya daerah lain.","Mengutamakan kepentingan bersama dan menjaga kerukunan."]},
        {judul:"4. Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan", paragraf:["Sila keempat menempatkan musyawarah, kebijaksanaan, dan penghormatan terhadap pendapat sebagai dasar pengambilan keputusan bersama. Keputusan tidak seharusnya ditentukan melalui pemaksaan kehendak."], poin:["Memberi kesempatan kepada semua anggota menyampaikan pendapat.","Bermusyawarah dalam menentukan ketua kelas atau kegiatan bersama.","Menerima dan melaksanakan keputusan bersama secara bertanggung jawab."]},
        {judul:"5. Keadilan Sosial bagi Seluruh Rakyat Indonesia", paragraf:["Sila kelima mengarahkan kehidupan bersama agar hak, kesempatan, dan kesejahteraan dapat dinikmati secara adil. Keadilan juga menuntut keseimbangan antara hak dan kewajiban."], poin:["Membagi tugas kelompok secara proporsional.","Tidak mengambil hak orang lain.","Menghargai hasil karya orang lain dan membantu yang membutuhkan."]},
        {judul:"Keterkaitan Antarsila", paragraf:["Kelima sila tidak berdiri sendiri. Setiap sila saling berhubungan dan saling menjiwai sehingga membentuk satu sistem nilai yang utuh. Dalam susunan hierarkis-piramidal, sila pertama menjiwai sila-sila berikutnya; sila kedua dijiwai sila pertama dan menjiwai sila ketiga sampai kelima; demikian pula sila ketiga dan keempat menjadi dasar bagi pengamalan sila-sila setelahnya.","Contohnya, membantu teman tanpa membeda-bedakan latar belakang mencerminkan kemanusiaan, memperkuat persatuan, dan mewujudkan keadilan. Tindakan itu juga harus dilandasi penghormatan terhadap keyakinan serta dilakukan dengan cara yang bijaksana."], poin:["Satu tindakan dapat mencerminkan lebih dari satu sila.","Tidak tepat memahami atau menerapkan satu sila dengan mengabaikan sila lainnya.","Nilai ketuhanan, kemanusiaan, persatuan, kerakyatan, dan keadilan harus berjalan bersama."]}

      ebooks:[EB1,EB2],
      jurnal:{judul:"Menghilangkan Break the Rules Habbit dengan Meningkatkan Pemahaman Nilai Etika Pancasila", penulis:"Sabila Pramesti S., Shakeela Rohmatunnisa, dan Wahyu Wardani", publikasi:"Pancasila: Jurnal Keindonesiaan, Vol. 2, No. 1, April 2022, hlm. 83–91", doi:"10.52738/pjk.v2i1.77", url:"https://ejurnalpancasila.bpip.go.id/index.php/PJK/article/view/77", pdf:"https://ejurnalpancasila.bpip.go.id/index.php/PJK/article/download/77/28/254", ringkasan:"Artikel membahas kebiasaan melanggar aturan dan peran pemahaman etika Pancasila untuk membentuk perilaku tertib. Penulis menjelaskan lima nilai etika Pancasila—ketuhanan, kemanusiaan, persatuan, kerakyatan, dan keadilan—sebagai pedoman perilaku.", metode:"Penelitian kualitatif dengan metode deskriptif.", temuan:"Pelanggaran aturan dapat dipengaruhi faktor internal, seperti rendahnya pengendalian diri, maupun faktor eksternal, seperti keluarga, institusi, lingkungan masyarakat, dan teman. Nilai etika Pancasila dipaparkan sebagai pedoman untuk membangun perilaku yang baik dan menaati aturan.", kesimpulan:"Pemahaman nilai etika Pancasila dapat menjadi landasan pembentukan perilaku tertib. Artikel ini relevan dengan sub-bab A karena membahas nilai-nilai Pancasila sebagai satu kesatuan sistem etika."}},
   b:{no:"B", world:"WORLD 1-2", judul:"Memaknai Pancasila sebagai Ideologi Negara",
      desc:"Pahami kedudukan Pancasila sebagai dasar negara dan pandangan hidup bangsa Indonesia.",
